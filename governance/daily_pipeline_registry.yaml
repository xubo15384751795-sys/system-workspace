schema_version: daily_pipeline_registry.v3
updated_at: '2026-07-30'
generated_views:
  - governance/daily_run_sequence.yaml
# Known external inputs — paths consumed by steps but not produced by any
# prior step.  These are sourced from Harvester, CaseLab, or manual imports.
external_inputs:
  - external_providers
  - Data/panels/cross_asset_daily_panel.parquet
  - caselab_context/
  - caselab_runtime/
  - governance/operator_registry.yaml
  - governance/
  - scripts/
  - "packages/framework_v1_archive/src/"
  - Output/runs/
  - Output/current/latest_run_id.txt
  - Output/system_learning/latest/supervisor_check.json
  - Output/system_learning/latest/output_routing_report.json
  - Output/system_learning/runtime/
  - .cursor/checkpoints/
  - Paper/90_Admin/
  - Output/system_learning/latest/threshold_review_candidates.json
  - Output/strategy_lab/qlib_experiment/lightgbm_experiment.json
  - Output/strategy_lab/backtest_result.json
  # Routing destination declared in governance/output_routing_policy.yaml
  # (routes.research). output_routing_audit scans it; no pipeline step
  # produces it, so it is a root input like Output/runs/ above.
  - Output/research/

# Execution-mode projections are part of the same authority registry.  They
# are compiled and validated with the daily graph; callers must not maintain
# another producer list for refresh or work-cycle modes.
execution_profiles:
  refresh_current:
    - neutral_pressure_measurement
    - quality_validation
    - measurement_quality_report
    - judgment_layer
    - judgment_promotion_gate
    - trade_decision
    - risk_gate
    - record_trade_decision
    - signal_card
    - signal_consensus
    - current_status
    - system_index
    - work_brief
    - next_actions
    - evidence_grade_report
    - build_artifact_registry
    - record_daily_run_event
    - readme_first
    - freshness_validator
  work_cycle_quick_render:
    - signal_card
    - signal_consensus
    - work_brief
    - build_data_gaps
  work_cycle_standard_core:
    - quality_validation
    - judgment_layer
    - judgment_promotion_gate
    - trade_decision
    - risk_gate
    - record_trade_decision
    - market_feedback
    - claim_evaluator
    - claim_ladder_tracker
    - learning_hub_feedback
    - learning_summary
    - system_index
    - readme_first
    - next_actions
  work_cycle_always:
    - change_analysis
    - supervisor_check
    - governance_status

# Step defaults — individual steps override only when they differ.
# NOTE: This block is documentation for human readers. The merge logic
# lives in scripts/daily_run.py (or _daily_run_sequence.py) which reads
# _defaults and applies them as fallback values for each step.
_defaults:
  ttl_hours: 48
  failure_behavior: continue_with_warning
  allowed_to_affect_core_judgment: false
  core_judgment_dependency: false
  frequency_monitoring:
    non_daily_requires_registered_outputs: true
    non_daily_requires_content_clock: true
  execution:
    mode: subprocess
    cwd_policy: workspace_root
    env_policy: inherited_minimal

# Content-level clocks live beside the runtime registry so a path change cannot
# update the producer without also updating the monitor.  freshness_validator
# and artifact_monitoring_audit both compile this table; neither keeps a second
# hand-written path list.
content_freshness:
  etf_panel:
    path: Data/panels/cross_asset_daily_panel.parquet
    date_column: date
    calendar: XNYS
    max_trading_days_behind: 3
    owner_step: refresh_cross_asset_panel
    decision_critical: true
  ofr_fsi_cache:
    path: Data/harvester/raw/external_indicators/ofr_fsi.csv
    date_column: date
    calendar: XNYS
    max_trading_days_behind: 10
    owner_step: harvester
    decision_critical: true
  ciss_cache:
    path: Data/harvester/raw/external_indicators/ciss.csv
    date_column: TIME_PERIOD
    calendar: XNYS
    max_trading_days_behind: 10
    owner_step: harvester
    decision_critical: true
  benchmark_panel:
    path: Data/harvester/exports/latest/data/benchmark_panel.parquet
    date_column: date
    calendar: XNYS
    max_trading_days_behind: 5
    owner_step: harvester
    decision_critical: true

# Coverage contracts for durable inputs and compatibility pointers that are
# not themselves produced by a scheduled registry step.  These are presence
# and ownership contracts, not freshness PASS claims; the owning path still
# has to satisfy its own content/authority checks.
monitoring_contracts:
  current_run_pointer:
    path: Output/current/latest_run_id.txt
    class: authoritative
    owner: PublishTransaction
    mode: pointer_integrity
    reason: generation-owned current-run identity
  current_decision_trace:
    path: Output/current/decision_trace.json
    class: decision_adjacent_shadow
    owner: PublishTransaction
    mode: pointer_integrity
    reason: compatibility decision trace must resolve with current output
  learning_hub_governance_status_registry:
    path: Data/system_learning/registries/governance_status_registry.yaml
    class: decision_adjacent_shadow
    owner: Learning Hub
    mode: version_controlled_input
    reason: governance guards read this registry to deny unsafe reuse
  learning_hub_issue_registry:
    path: Data/system_learning/registries/issue_registry.yaml
    class: decision_adjacent_shadow
    owner: Learning Hub
    mode: version_controlled_input
    reason: canonical issue severity and hard-gate taxonomy
  learning_hub_routing_rules:
    path: Data/system_learning/registries/routing_rules.yaml
    class: decision_adjacent_shadow
    owner: Learning Hub
    mode: version_controlled_input
    reason: issue-to-owner routing policy
  learning_hub_verification_policy:
    path: Data/system_learning/registries/verification_policy.yaml
    class: decision_adjacent_shadow
    owner: Learning Hub
    mode: version_controlled_input
    reason: improvement verification evidence policy

# P0-4 wave 2: every monitoring blind spot must land in one class with an owner.
# authoritative + decision_adjacent_shadow cannot remain uncovered.
# First matching rule wins — keep specific prefixes above catch-alls.
monitoring_classification:
  required_coverage_classes:
    - authoritative
    - decision_adjacent_shadow
  classes:
    - authoritative
    - decision_adjacent_shadow
    - research
    - manual_on_demand
    - archived_retire
  rules:
    # These files are convenience views produced only by explicit Workbench
    # tools.  Their presence under Output/current does not make them part of
    # the authoritative daily readout.
    - pattern: Output/current/artifact_navigator.*
      class: manual_on_demand
      owner: Workbench
    - pattern: Output/current/benchmark_evidence_dashboard.*
      class: manual_on_demand
      owner: Workbench
    # These are retained compatibility artifacts from producers that are no
    # longer on the default refresh path.
    - pattern: Output/current/latest_summary.md
      class: archived_retire
      owner: Workbench
    - pattern: Output/current/model_run.json
      class: manual_on_demand
      owner: Workbench
    - pattern: Output/current/operator_activations.json
      class: archived_retire
      owner: ML Signals
    # Explicitly retired/reclassified historical surfaces.  Keep these
    # specific rules before the broad current/quality/system-learning rules.
    - pattern: Data/panels/benchmark_panel_5yr.parquet
      class: archived_retire
      owner: Data/Output
    - pattern: Data/panels/cross_asset_daily_panel.csv.gz
      class: archived_retire
      owner: Workbench Signals
    - pattern: Data/panels/cross_asset_features.parquet
      class: archived_retire
      owner: Workbench Signals
    - pattern: Data/system_learning/ledgers/provenance_gap_ledger.jsonl
      class: archived_retire
      owner: Learning Hub
    - pattern: Data/system_learning/structural_lab/codebase_metrics/history.parquet
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/quality/PIPELINE_TRIAGE_PLAN.md
      class: archived_retire
      owner: Data/Output
    - pattern: Output/quality/PROJECT_REFACTOR_AUDIT.json
      class: archived_retire
      owner: Data/Output
    - pattern: Output/quality/PROJECT_REFACTOR_AUDIT.md
      class: archived_retire
      owner: Data/Output
    - pattern: Output/quality/ge_content_freshness.json
      class: archived_retire
      owner: Framework
    - pattern: Output/quality/quality_content_freshness.json
      class: decision_adjacent_shadow
      owner: Framework
    - pattern: Output/quality/governance_yield_report.json
      class: archived_retire
      owner: Governance
    - pattern: Output/quality/governance_yield_report.md
      class: archived_retire
      owner: Governance
    - pattern: Output/quality/freshness_report.md
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/system_learning/latest/proxy_quality_report.*
      class: archived_retire
      owner: ML Signals
    - pattern: Output/system_learning/governance_audit/*
      class: manual_on_demand
      owner: Learning Hub
    - pattern: Output/system_learning/research_posture/*
      class: manual_on_demand
      owner: Learning Hub
    - pattern: Output/system_learning/latest/abandoned_work_report.md
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/system_learning/latest/experiment_core_judgment_audit.*
      class: archived_retire
      owner: Workbench
    - pattern: Output/system_learning/latest/feedback_improvement_queue.md
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/system_learning/latest/governance_drag_report.json
      class: manual_on_demand
      owner: Governance
    - pattern: Output/system_learning/latest/hypothesis_inflow.json
      class: manual_on_demand
      owner: Learning Hub
    - pattern: Output/system_learning/latest/judgment_calibration_summary.json
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/system_learning/latest/module_activity_distribution.*
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/system_learning/latest/scripts.commands.weekly.architecture_reality_audit.*
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/system_learning/latest/scripts.commands.weekly.governance_status.*
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/system_learning/latest/trade_decision_calibration_summary.json
      class: archived_retire
      owner: Learning Hub
    - pattern: Output/current/*
      class: authoritative
      owner: Workbench
    - pattern: Data/harvester/exports/*
      class: authoritative
      owner: Harvester
    - pattern: Data/panels/*
      class: authoritative
      owner: Harvester
    - pattern: Data/features/*
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/k_measurement/*
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/x_measurement/*
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/judgment/*
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/quality/*
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/system_learning/*
      class: decision_adjacent_shadow
      owner: Learning Hub
    - pattern: Data/system_learning/*
      class: decision_adjacent_shadow
      owner: Learning Hub
    - pattern: Data/paper_world_model/*
      class: decision_adjacent_shadow
      owner: Harvester
    - pattern: Output/runs/*
      class: decision_adjacent_shadow
      owner: Workbench
    - pattern: Output/sandbox/*
      class: research
      owner: Workbench
    - pattern: Output/research/*
      class: research
      owner: Workbench
    - pattern: Output/validation/*
      class: research
      owner: ML Signals
    - pattern: Output/strategy_lab/*
      class: research
      owner: ML Signals
    - pattern: Output/benchmarks/*
      class: research
      owner: Workbench
    - pattern: Output/caselab/*
      class: research
      owner: CaseLab
    - pattern: Output/workbench/*
      class: research
      owner: Workbench
    - pattern: Data/fixtures/*
      class: research
      owner: Workbench
    - pattern: Output/archive/*
      class: archived_retire
      owner: Workbench
    - pattern: Data/archive/*
      class: archived_retire
      owner: Harvester
    - pattern: Data/structural_lab/*
      class: archived_retire
      owner: Framework
    - pattern: Data/merged_data/*
      class: archived_retire
      owner: Harvester
    - pattern: Output/deformation_runs/*
      class: archived_retire
      owner: Framework
    - pattern: Output/reports/*
      class: archived_retire
      owner: ML Signals
    - pattern: Output/*
      class: research
      owner: Workbench
    - pattern: Data/*
      class: manual_on_demand
      owner: System

steps:
  harvester:
    order: 1
    status: active
    owner: Harvester
    command: python -m harvester daily-release
    input: &id001
    - external_providers
    produces: &id002
    - Data/harvester/exports/latest/
    - Data/harvester/exports/.dvc_meta/latest_pointer.json*
    artifact_path: Data/harvester/exports/latest/catalog.json
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: block_core_judgment
    execution:
      mode: subprocess
      current_command: python -m harvester daily-release
      future_callable: harvester.cli:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id001
      outputs: *id002
      emits_run_event: true
    authority:
      affects_core_judgment: true
      failure_behavior: block_core_judgment
      owner: Harvester
    skip_flag: skip_harvester
  etf_refresh:
    order: 2
    status: active
    owner: Harvester
    depends_on:
      - refresh_cross_asset_panel
    command: python scripts/refresh_etf_panel.py
    input: &id003
    - Data/panels/cross_asset_daily_panel.parquet
    produces: &id004
    - Data/features/k_features_daily.csv
    consumes:
    - Data/panels/cross_asset_daily_panel.parquet
    artifact_path: Data/features/k_features_daily.csv
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: false
    core_judgment_dependency: false
    failure_behavior: research_only
    # Both halves of this step are blocked, not just acquisition. The
    # previous text said the script "may recompute features only", which
    # implied feature recomputation worked; it does not. Corrected 2026-08-01.
    blocker: >-
      Two independent gaps. (1) ETF acquisition is not yet published as a
      Harvester evidence release. (2) Feature recomputation cannot run:
      scripts/k_features_from_etf.py was archived in 878bca4 as an
      experimental/archive_candidate script and is not in scripts/archive/
      either, so update_k_features() logs and returns False on every run.
      The declared artifact Data/features/k_features_daily.csv is therefore
      unmaintained — frozen at 2026-06-17 — and this step currently produces
      nothing. Panel freshness is covered separately by
      refresh_cross_asset_panel, which owns the etf_panel content check.
    artifact_status: unmaintained_since_2026-06-17
    execution:
      mode: callable
      current_command: python scripts/refresh_etf_panel.py
      future_callable: scripts.refresh_etf_panel:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id003
      outputs: *id004
      emits_run_event: true
    authority:
      affects_core_judgment: false
      failure_behavior: research_only
      owner: Harvester
    skip_flag: skip_etf
  paper_sync:
    order: 3
    status: active
    owner: Harvester
    command: python scripts/sync_paper_world_model.py
    input: &id005
    - Data/harvester/exports/latest/
    produces: &id006
    - Data/paper_world_model/
    artifact_path: Data/paper_world_model/
    ttl_hours: 72
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: lower_claim_ceiling
    execution:
      mode: subprocess
      current_command: python scripts/sync_paper_world_model.py
      future_callable: workbench.workspace.paper_sync:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id005
      outputs: *id006
      emits_run_event: true
    authority:
      affects_core_judgment: true
      failure_behavior: lower_claim_ceiling
      owner: Harvester
  horizon_events:
    order: 4
    status: archived
    owner: Harvester
    archive_reason: "No data source — Horizon dormant since 2026-06-02"
    # command: python scripts/horizon_event_adapter.py
    input: &id007
    - Data/harvester/exports/latest/
    produces: &id008
    - Data/horizon_events/
    artifact_path: Data/horizon_events/
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: false
    failure_behavior: lower_claim_ceiling
    execution:
      mode: subprocess
      current_command: python scripts/horizon_event_adapter.py
      future_callable: workbench.signals.horizon:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id007
      outputs: *id008
      emits_run_event: true
    authority:
      affects_core_judgment: true
      failure_behavior: lower_claim_ceiling
      owner: Harvester
  neutral_pressure_measurement:
    order: 6
    status: active
    owner: Workbench
    command: python scripts/neutral_pressure_measurement.py
    input: &neutral_pressure_inputs
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    consumes:
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    produces: &neutral_pressure_outputs
    - Output/current/neutral_pressure_snapshot.json
    - Output/current/framework_output.json
    artifact_path: Output/current/neutral_pressure_snapshot.json
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: block_current_readout
    execution:
      mode: subprocess
      current_command: python scripts/neutral_pressure_measurement.py
      future_callable: scripts.neutral_pressure_measurement:main
      native_core_boundary: shadow_pilot
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *neutral_pressure_inputs
      outputs: *neutral_pressure_outputs
      emits_run_event: true
    authority:
      affects_core_judgment: true
      failure_behavior: block_current_readout
      owner: Workbench
  structural_replay:
    order: 6.1
    status: archived
    schedule: on_demand
    owner: Deformation Framework
    command: python scripts/structural_replay_v2.py
    input: &id009
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    consumes:
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    produces: &id010
    - Output/sandbox/structural_replay_v2/
    artifact_path: Output/sandbox/structural_replay_v2/results.json
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: false
    allowed_to_affect_core_judgment: false
    core_judgment_dependency: false
    failure_behavior: block_current_readout
    execution:
      mode: callable
      current_command: python scripts/structural_replay_v2.py
      future_callable: scripts.structural_replay_v2:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id009
      outputs: *id010
      emits_run_event: true
    authority:
      affects_core_judgment: false
      failure_behavior: block_current_readout
      owner: Deformation Framework
  bridge:
    order: 6.2
    status: archived
    schedule: on_demand
    owner: Workbench
    command: python scripts/bridge_replay_to_current.py
    input: &id011
    - Output/sandbox/structural_replay_v2/
    consumes:
    - Output/sandbox/structural_replay_v2/
    produces: &id012
    - Output/current/framework_output.json
    artifact_path: Output/current/framework_output.json
    ttl_hours: 48
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: block_current_readout
    execution:
      mode: subprocess
      current_command: python scripts/bridge_replay_to_current.py
      future_callable: scripts.bridge_replay_to_current:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id011
      outputs: *id012
      emits_run_event: true
    authority:
      affects_core_judgment: true
      failure_behavior: block_current_readout
      owner: Workbench
  run_operator_detections:
    order: 8
    status: archived
    archive_reason: "Deformation v1 operator runtime retained as evidence only"
    owner: Deformation Framework
    command: python scripts/archive/run_operator_detections.py
    schedule: weekly
    input:
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    produces:
    - Output/current/operator_activations.json
    artifact_path: Output/current/operator_activations.json
    ttl_hours: 48
    allowed_to_affect_core_judgment: false
    core_judgment_dependency: false
    failure_behavior: continue_with_warning
    execution:
      mode: subprocess
      current_command: python scripts/archive/run_operator_detections.py
      future_callable: scripts.run_operator_detections:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    authority:
      affects_core_judgment: false
      failure_behavior: continue_with_warning
      owner: Deformation Framework
    contracts:
      inputs:
      - Data/harvester/exports/latest/data/benchmark_panel.parquet
      outputs:
      - Output/current/operator_activations.json
  validate_proxy_observation_catalog:
    order: 9
    status: active
    owner: Harvester
    command: python scripts/archive/validate_proxy_observation_catalog.py
    schedule: weekly
    input:
    - governance/proxy_observation_catalog.yaml
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    produces:
    - Output/quality/proxy_catalog_report.json
    - Output/quality/proxy_catalog_report.md
    artifact_path: Output/quality/proxy_catalog_report.json
    ttl_hours: 168
    allowed_to_affect_core_judgment: false
    core_judgment_dependency: false
    failure_behavior: continue_with_warning
    execution:
      mode: subprocess
      current_command: python scripts/archive/validate_proxy_observation_catalog.py
      future_callable: scripts.validate_proxy_observation_catalog:main
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    authority:
      affects_core_judgment: false
      failure_behavior: continue_with_warning
      owner: Harvester
    contracts:
      inputs:
      - governance/proxy_observation_catalog.yaml
      - Data/harvester/exports/latest/data/benchmark_panel.parquet
      outputs:
      - Output/quality/proxy_catalog_report.json
      - Output/quality/proxy_catalog_report.md
  quality_validation:
    order: 10
    status: active
    owner: Protocols
    command: python scripts/quality_field_validator.py
    input: &id013
    - Output/current/framework_output.json
    produces: &id014
    - Output/current/quality_validation.json
    artifact_path: Output/current/quality_validation.json
    ttl_hours: 48
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: block_promotion
    execution:
      mode: subprocess
      current_command: python scripts/quality_field_validator.py
      future_callable: scripts.quality_field_validator:main
      native_core_boundary: shadow_pilot
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id013
      outputs: *id014
      emits_run_event: true
    authority:
      affects_core_judgment: true
      failure_behavior: block_promotion
      owner: Protocols
  regime_detection:
    order: 11
    status: experimental
    owner: ML Signals
    command: Workbench ml.regime_detector.detect_regime(...)
    input: &id015
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    consumes:
    - Data/harvester/exports/latest/data/benchmark_panel.parquet
    produces: &id016
    - Output/ml_signals/
    artifact_path: Output/ml_signals/
    ttl_hours: 48
    allowed_to_affect_core_judgment: false
    core_judgment_dependency: false
    failure_behavior: block_current_readout
    execution:
      mode: subprocess
      current_command: Workbench ml.regime_detector.detect_regime(...)
      future_callable: ml.regime_detector:detect_regime
      cwd_policy: workspace_root
      env_policy: inherited_minimal
    contracts:
      inputs: *id015
      outputs: *id016
      emits_run_event: true
    authority:
      affects_core_judgment: false
      failure_behavior: block_current_readout
      owner: ML Signals
  archive_hmm_calibration_snapshot:
    order: 12
    status: active
    owner: ML Signals
    command: python scripts/archive_hmm_calibration_snapshot.py
