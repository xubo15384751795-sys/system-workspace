# Pre-commit hooks — minimal gate + lint-only ruff.
# Install:  pre-commit install
# Run all:  pre-commit run --all-files
#
# Ruff is lint-only here (no auto-format).  Add ruff-format or black
# separately when the codebase is ready for a formatting pass.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^packages/  # packages have their own CI/lint; avoid false positives from submodule code
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args:
          - "--select=E,F,W,I"
          - "--ignore=E501,E402"
        types_or: [python, pyi]
        exclude: ^packages/  # packages/ have their own pyproject lint configs (editable installs)

  # Governance freeze — block commits that add unapproved governance files
  # or tamper with baseline file content.
  - repo: local
    hooks:
      - id: governance-freeze
        name: governance-freeze-check
        entry: env PYTHONPATH=.:packages/orchestration uv run --locked python -m scripts.check_governance_freeze
        language: system
        files: ^governance/
        pass_filenames: false
        always_run: false
      - id: pace-routing-decision
        name: pace L3/L4 routing-decision check
        entry: uv run --locked python -m scripts.commands.ci.check_pace_routing
        language: system
        files: ^(PACE\.md|ROUTING_CONSTITUTION\.md|MODULES\.md|FOLDER_OWNERSHIP\.md|governance/|protocols/|module_contexts/|system_runtime/|\.github/workflows/|\.pre-commit-config\.yaml)
        # With no explicit paths the checker reads the staged diff. This keeps
        # local commits strict while preventing CI's --all-files mode from
        # misclassifying the entire repository as one change.
        pass_filenames: false
        always_run: false

      - id: just-preflight
        name: just preflight (make test + isolated daily_run)
        entry: just preflight
        language: system
        pass_filenames: false
        always_run: true

      # Pre-push only. Branch protection is unavailable on this repo (private)
      # on a free plan: the branch-protection API returns 403), so nothing
      # server-side can stop a red commit reaching main — as happened with
      # 0e3b9c2, which broke test_consumes_traceable_to_upstream and left
      # merge-gate red on main for a day before anyone noticed.
      #
      # This subset is the cheap half of merge-gate: the registry/sequence
      # contract checks that catch that class of break in ~1.5s. It is not a
      # substitute for merge-gate, which still runs the full suite in CI.
      - id: contract-gate
        name: contract gate (registry/sequence/freeze)
        entry: >-
          python3 -m pytest -q -p no:randomly
          tests/test_daily_pipeline_io_contract.py
          tests/test_daily_pipeline_contract.py
          tests/test_pipeline_sequence_sync.py
          tests/test_governance_freeze.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
