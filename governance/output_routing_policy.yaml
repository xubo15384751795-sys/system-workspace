schema_version: output_routing.v1
created: "2026-06-17"
purpose: >
  Automatic routing, lifecycle, and archival of Output artifacts.
  Every output must have a display_group, lifecycle status, and TTL.

groups:
  current:
    path: Output/current/
    description: "Authority user entry points only"
    can_affect_user_readout: true
    allowed_artifacts:
      - 00_READ_ME_FIRST.md
      - framework_output.json
      - status.json
      - next_actions.md
      - artifact_navigator.md
      - artifact_navigator.json
      - benchmark_evidence_dashboard.md
      - benchmark_evidence_dashboard.html
      - latest_run_id.txt
      - latest_summary.md
      - quality_validation.json
      - model_run.json
      - decision_trace.json
      - work_brief.md
      - work_brief.json
      - signal_card.md
      - signal_card.json
      - signal_consensus.md
      - signal_consensus.json
      - data_gaps.md
      - data_gaps.json
      - change_analysis.md
      - change_analysis.json
      - evidence_grade_report.json
      - artifact_registry.json
      - measurement_quality.json
      - operator_activations.json  # mechanism operator readout; does not affect core judgment

  runs:
    path: Output/deformation_runs/
    description: "Formal run packages with provenance"
    can_affect_core_judgment: true

  research:
    path: Output/research/
    description: "Backtest, ML, K/X/NLP experiments"
    can_affect_core_judgment: false
    default_ttl_days: 30

  governance:
    path: Output/system_learning/
    description: "Audit, learning, feedback"
    can_affect_core_judgment: false

  ml_validation:
    path: Output/validation/
    description: "Walk-forward, baseline comparison, as-of integrity — review-only diagnostics"
    can_affect_core_judgment: false
    allowed_use: validation_only
    lifecycle: active
    owner: ML Signals

  sandbox:
    path: Output/sandbox/
    description: "Temporary experiments"
    can_affect_core_judgment: false
    default_ttl_days: 7

  archive:
    path: Output/archive/
    description: "Frozen history"
    can_affect_core_judgment: false

  legacy_proxy_pipeline:
    path: "Output/{benchmark_comparison,calibration,d_proxy_daily,m_proxy_daily,m_proxy_optimized,market_state_classifier,proxy_validation,solution,walk_forward_validation}/"
    description: "Legacy proxy pipeline outputs — produced by archived scripts only"
    can_affect_core_judgment: false
    lifecycle: archived
    owner: ML Signals
    default_ttl_days: 90
    note: "No active code reads these. Last updated 2026-06-09. Safe to delete after 2026-09-09."

  legacy_reports:
    path: Output/reports/
    description: "Legacy morphology reports"
    can_affect_core_judgment: false
    lifecycle: archived
    owner: ML Signals
    default_ttl_days: 90
    note: "Last updated 2026-05-17. Safe to delete after 2026-08-17."

  legacy_evaluation:
    path: Output/workbench/evaluation/
    description: "Legacy replay evaluation data"
    can_affect_core_judgment: false
    lifecycle: archived
    owner: Workbench
    default_ttl_days: 90
    note: "Last updated 2026-05-05. Safe to delete after 2026-08-05."

lifecycle_statuses:
  draft:
    description: "Being generated, not yet complete"
    can_be_consumed: false

  candidate:
    description: "Complete but not yet validated"
    can_be_consumed: true
    can_affect_core_judgment: false

  current:
    description: "Active authority artifact"
    can_be_consumed: true
    can_affect_core_judgment: true

  research_only:
    description: "Research/training only"
    can_be_consumed: true
    can_affect_core_judgment: false

  superseded:
    description: "Replaced by newer version"
    can_be_consumed: false
    archive_after_days: 7

  archived:
    description: "Frozen, kept for traceability"
    can_be_consumed: false

  retired:
    description: "No longer relevant"
    can_be_consumed: false

rules:
  - "Output/current/ must only contain artifacts listed in groups.current.allowed_artifacts"
  - "sandbox artifacts older than ttl_days must be moved to archive"
  - "research artifacts with no consumers for 30 days become archive_candidate"
  - "unregistered Output directories require owner and lifecycle status"
  - "legacy display symlinks must not exist in Output/current/"
