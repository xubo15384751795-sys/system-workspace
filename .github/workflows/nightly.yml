# Nightly Full Pipeline — comprehensive validation including all module tests.
#
# Runs daily at 05:00 UTC. Covers everything:
#   - All 4 package test suites (independent)
#   - Root contract tests
#   - Full daily pipeline dry-run (33+ steps)
#   - Architecture boundary audit
#   - Operator registry audit
#   - Schema validation (fail-closed when current artifacts missing)
#
# This is the safety net that catches drift between modules.
#
# 2026-07-07: Submodules consolidated into packages/ — no submodule checkout needed.
# 2026-07-27: P0-1 — repair migrated weekly script paths; unify install/PYTHONPATH;
#             schema/freshness fail-closed for scheduled depth checks.

name: Nightly Full Pipeline

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:

env:
  PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"

jobs:
  # ── Per-module tests (parallel) ─────────────────────────────────────────

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e .
          pip install -e "packages/workbench[dev]"
      - name: Run Workbench tests
        working-directory: packages/workbench
        run: pytest tests/ -q --tb=short

  deformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e .
          pip install -e "packages/framework[dev]"
      - name: Run deformation-framework tests
        working-directory: packages/framework
        run: pytest tests/ -q --tb=short

  harvester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e .
          pip install -e "packages/harvester[dev]"
      - name: Run harvester tests
        working-directory: packages/harvester
        run: pytest tests/ -q --tb=short

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e .
          pip install -e "packages/learning_hub[dev]"
      - name: Run learning-hub tests
        working-directory: packages/learning_hub
        run: pytest tests/ -q --tb=short

  # ── Full integration (gates on all module tests) ────────────────────────

  full-integration:
    needs: [workbench, deformation, harvester, hub]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml
            requirements-dev.txt
      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[dev]"
          pip install -e "packages/workbench[dev]"
          pip install -e "packages/framework[dev]"
          pip install -e "packages/harvester[dev]"
          pip install -e "packages/learning_hub[dev]"
      - name: Path existence smoke
        run: |
          set -euo pipefail
          for path in \
            scripts/commands/weekly/architecture_reality_audit.py \
            scripts/commands/weekly/operator_registry_audit.py \
            scripts/daily_run.py \
            scripts/verify_merge.py \
            scripts/check_output_freshness.py \
            scripts/commands/ci/validate_current_schemas.py
          do
            test -f "$path" || { echo "MISSING: $path"; exit 1; }
            echo "OK: $path"
          done
      - name: Root contract tests
        run: python -m pytest tests/ -q --tb=short
      - name: Daily pipeline dry-run
        run: python scripts/daily_run.py --dry-run
      - name: Architecture boundary audit
        run: python scripts/commands/weekly/architecture_reality_audit.py --json
      - name: Operator registry audit (offline)
        run: python scripts/commands/weekly/operator_registry_audit.py --json
      - name: Schema validation (clean runner N/A; never fake PASS)
        run: python -m scripts.commands.ci.validate_current_schemas --ci-clean-checkout
      - name: Experiment → core judgment check
        run: python scripts/verify_experiment_core_judgment.py
      - name: Output freshness check (clean runner N/A; never fake PASS)
        run: python scripts/check_output_freshness.py --ci-clean-checkout --json
      - name: Type check
        run: python -m mypy scripts/ --ignore-missing-imports --no-error-summary
