[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-workbench"
version = "0.2.0"
description = "Structural-risk research workbench: evidence ingestion, NLP pipeline, and risk cockpit."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # data & serialisation
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "httpcore>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
nlp = [
    # heavy NLP — install only when running the NLP pipeline
    "sentence-transformers>=2.6",
    "bertopic>=0.16",
    "scikit-learn>=1.3",
]
ml = [
    # classical ML — SVD graph embedding fallback uses numpy (already core)
    "scikit-learn>=1.3",
    "numpy>=2.0",
]
gnn = [
    # GNN backend — activates Node2Vec in GraphEmbedder automatically
    "torch>=2.0",
    "torch-geometric>=2.5",
    "numpy>=2.0",
]
charts = [
    "matplotlib>=3.7",
]
llm = [
    "anthropic>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
dl-core = [
    "torch>=2.0",
    "numpy>=2.0",
]
dl-nlp = [
    "sentence-transformers>=2.2",
    "transformers>=4.30",
]
dl-graph = [
    "torch-geometric>=2.3",
]
dl-full = [
    "pytorch-forecasting>=1.0",
    "hmmlearn>=0.3",
]

[project.scripts]
wb-check    = "workbench.current:main"
wb-evidence = "workbench.evidence_dashboard:main"
wb-validate = "workbench.contract_validator:main"
wb-demo     = "workbench.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
