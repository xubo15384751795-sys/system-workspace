[pytest]
testpaths = tests
addopts = -m "not operator and not network and not external_repo and not slow" --strict-markers
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    Data
    Output
    Workbench
    Structural Deformation Research System
    Structural Risk Harvester
    Structural Research Harness
    System Learning Hub
    contracts
markers =
    critical_gate: tests that must pass before promotion (routing, config, authority gates)
    semantic: concept registry, proxy semantics, NOT_IMPLEMENTED enforcement
    data_boundary: data boundary compliance, freshness, provenance
    benchmark: benchmark correctness (Qlib placeholder, real metrics, comparison validity)
    report: report verdict gate, export validation
    governance_loop: ledger, escalation, incident lifecycle
    slow: tests that take >10s, excluded from default runs
    operator: tests that require an initialized operator workspace (Data/Output state); excluded by default
    network: tests that make live network calls; excluded by default
    external_repo: tests that require external repositories (Paper vault, CaseLab fixtures); excluded by default
