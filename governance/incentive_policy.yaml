schema_version: incentive_policy.v1
created: "2026-06-17"
updated: "2026-06-18"
purpose: >
  Priority incentive system — rewards compliant, useful, and reusable contributions
  with visibility and review priority. Non-compliant exploration is allowed
  when declared, but starts as low-priority and cannot affect core judgment until reviewed.
  Referenced by: architecture_cleanup_decisions.md

core_principle: >
  系统不惩罚探索，但奖励可追溯、可复用、被消费、能改进规则的探索。
  Exploration is permitted by default.
  Priority is earned, not assumed.
  Core judgment authority is reviewed, not self-claimed.
  Useful deviation can improve the rules.

# ── Authority Boundary ──────────────────────────────────────────────────────
# Governance has veto power but not granting power.
# Credit improves review priority, never grants authority.
authority_boundary:
  credit_never_grants_authority: true
  governance_can_veto: true
  governance_can_grant_core_authority: false
  canonical_authority_requires_runtime_wiring: true
  principle: >
    治理拥有边界权威，不拥有事实权威；治理可以阻止越权，不能替代验证。
    Governance has boundary authority, not factual authority.
    It can block overreach, but cannot substitute for verification.
    Canonical entry requires: code wiring + artifact contract + tests + data provenance.

# ── Priority Levels ──────────────────────────────────────────────────────────
priority_levels:
  low:
    meaning: "Allowed to exist, not preferred. Cannot affect core judgment."
    visibility: sandbox_only
    can_enter_current: false
    can_affect_core_judgment: false
    review_cadence: monthly

  registered:
    meaning: "Has owner/status/input/output. Usable by module owner."
    visibility: module_internal
    can_enter_current: false
    can_affect_core_judgment: false
    review_cadence: biweekly

  preferred:
    meaning: "Worth reviewing and considering for reuse. Has consumers and tests."
    visibility: cross_module
    can_enter_review_surface: true
    can_enter_authority_current: false
    can_affect_core_judgment: false
    review_cadence: weekly

  canonical:
    meaning: "Default trusted path. Enters core judgment chain."
    visibility: system_wide
    can_enter_review_surface: true
    can_enter_authority_current: true
    can_affect_core_judgment: true
    review_cadence: continuous

# ── Trust Credit Sources (Review Signals, Not Authority Grants) ─────────────
# credit → review priority → integration proposal → code wiring → possible canonical
# No step can be skipped. Credit only raises attention, never grants trust.
credit_sources:
  registration:
    review_weight: 1
    rule: "Has owner, status, input contract, output contract, TTL"
    suggests_review_for: registered

  provenance:
    review_weight: 2
    rule: "Data or artifact provenance declared and traceable"
    suggests_review_for: registered

  test_coverage:
    review_weight: 2
    rule: "Has passing test or validation check"
    suggests_review_for: registered

  consumed_by_module:
    review_weight: 2
    rule: "Consumed by at least one active module in daily_run or sys"
    suggests_review_for: preferred

  improves_existing_rule:
    review_weight: 4
    rule: "Accepted as governance improvement via experimental submission review"
    suggests_review_for: preferred

  harvester_aligned:
    review_weight: 3
    rule: "Data enters or requests Harvester path"
    suggests_review_for: preferred

  stable_consumption:
    review_weight: 3
    rule: "Consumed for 7+ consecutive runs without failure"
    suggests_review_for: preferred

  pipeline_baseline_pass:
    review_weight: 5
    rule: >
      All 77 pipeline governance baseline tests pass.  Step, artifact, or
      module is part of a fully verified governance chain.  See
      governance/pipeline_test_baseline.yaml for test layer breakdown.
    suggests_review_for: preferred

# ── Non-Compliant Exploration ────────────────────────────────────────────────
non_compliant_exploration:
  allowed: true
  default_priority: low
  default_visibility: sandbox_only
  forbidden:
    - affect_core_judgment_without_review
    - present_as_current_authority
    - overwrite_canonical_artifact
    - bypass_freshness_gate
  can_submit_for_review: true
  submission_path: governance/experimental_submission_registry.yaml

# ── Review Cadence ───────────────────────────────────────────────────────────
review_cadence:
  experimental_submissions: weekly
  priority_promotions: biweekly
  rule_updates: biweekly
  canonical_audits: monthly

# ── Review Outcomes ──────────────────────────────────────────────────────────
# Note: promote_to_canonical is NOT a review outcome.
# Canonical status requires code wiring + artifact contract + tests + data provenance.
# Review can recommend integration, but canonical entry happens in the main chain.
review_outcomes:
  - reject_keep_experimental       # Stay as research_only
  - accept_as_research             # Promote to registered
  - recommend_for_review           # Promote to preferred (review priority)
  - recommend_for_integration      # Suggest main chain integration (manual wiring required)
  - update_rule                    # Modify governance rule
  - create_harvester_request       # Submit data request to Harvester
  - create_module_contract_change  # Update module contract

# ── Demotion Triggers (machine-checked by build_incentive_review.py) ─────────
demotion_triggers:
  - id: gate_blocked_or_watch
    from: preferred
    to: registered
    rule: "Promotion gate not PASS/WATCH-ready — cannot stay preferred or above"
  - id: graph_drift_detected
    from: any
    to: registered
    rule: "Authority graph declared/derived drift > 0"
  - id: graph_invariants_failed
    from: any
    to: low
    rule: "Authority graph high-severity invariant failed"
  - id: trace_incomplete
    from: registered
    to: low
    rule: "Run bundle trace incomplete"

# ── Anti-Gaming Rules ────────────────────────────────────────────────────────
anti_gaming:
  not_rewarded:
    - "Producing many outputs without consumers"
    - "Running many experiments without validation"
    - "Bypassing Harvester without declaring"
    - "Writing scripts without tests"
    - "Making system harder to understand"
    - "Using credit score to claim authority"
    - "Treating preferred status as automatic canonical entry"

  rewarded:
    - "Being consumed by active modules"
    - "Improving traceability"
    - "Improving judgment quality"
    - "Reducing duplication"
    - "Increasing reusability"
    - "Discovering rule deficiencies"
    - "Proposing better paths"
    - "Entering Harvester pipeline"
