      role: funding_lag_indicator
      direct_to_deformation_allowed: false
    - series: DERIVED:SOFR_IORB_SPREAD
      role: funding_latency
      direct_to_deformation_allowed: false
  current_status: STRONG
  differentiation_from_raw: HIGH  # 80% unique info

