version: 1
owner: System Workspace
constitution: ROUTING_CONSTITUTION.md
purpose: >
  Sparse expert activation map for the System workspace. The always-active
  constitution stays small; local protocols activate only for matching tasks,
  artifacts, events, or risks.

global_always_active:
  - id: layer_authority
    rule: Evidence, code, wiki, papers, prompts, reports, and tests keep separate authority.
  - id: deny_precedence
    rule: Global deny rules cannot be overridden by local experts.
  - id: claim_registry_ceiling
    rule: Empirical claim language cannot exceed wiki/claims/claim_registry.md.
  - id: benchmark_proxy_separation
    rule: Benchmarks and controls do not enter Sigma_t proxy core by default.
  - id: deformation_downscope
    rule: Deformation does not own acquisition, provider collection, source validation, or Harvester bundles.
  - id: execution_verification_split
    rule: Generation and verification are separate phases with separate artifacts.

expert_protocols:
  - id: research_os_layers
    path: Structural Deformation Research System/prompts/policy/research_os_layers.md
    activate_when:
      - A task crosses evidence, code, wiki, reports, or paper layers.
      - A task changes authority boundaries between layers.
      - A generated output may become a claim, wiki entry, or paper citation.
    scope:
      - Layer ownership.
      - Cross-layer citation discipline.
      - Artifact authority boundaries.
    outputs:
      - Layer ownership note.
      - Cited layers list.
      - Boundary risks and unresolved approvals.
    forbidden:
      - Overriding manifests, claim registry, or capability contracts.

  - id: proxy_boundary
    path: Structural Deformation Research System/prompts/capability/proxy_boundary.md
    activate_when:
      - Editing src/proxies, src/benchmarks, src/diagnostics, or proxy configuration.
      - Adding or changing Sigma_t inputs.
      - Changing benchmark, residualization, no-lookahead, or rejection-gate behavior.
    scope:
      - Proxy and benchmark separation.
      - Manifest and frequency-policy checks.
      - No-lookahead alignment.
      - Rejection gate updates.
    outputs:
      - Proxy boundary review note.
      - Benchmark leakage decision.
      - Tests or audit commands run.
    forbidden:
      - Treating broad stress controls as proxy core by default.
      - Silently upgrading diagnostic meaning.

  - id: datahub_implementation
    path: Structural Deformation Research System/prompts/codex/implement_datahub.md
    activate_when:
      - Editing data access, adapters, manifests, provider routing, or DataHub bridge code.
      - Touching src/data, src/data_access, or Harvester integration boundaries.
    scope:
      - Data access implementation.
      - Manifest templates.
      - Provider metadata and source identity.
      - Legacy-to-Harvester migration safety.
    outputs:
      - Data boundary change note.
      - Manifest or adapter evidence.
      - Data access tests.
    forbidden:
      - Changing theory, variables, or paper claims.
      - Treating research corpus prose as structured data.

  - id: no_lookahead_tests
    path: Structural Deformation Research System/prompts/codex/no_lookahead_tests.md
    activate_when:
      - A task changes time alignment, release timing, backtests, historical replay, or benchmark comparison.
      - A paper or report cites temporal evaluation results.
    scope:
      - Lookahead prevention.
      - Training/evaluation split evidence.
      - Release-date and frequency policy checks.
    outputs:
      - No-lookahead evidence.
      - Test or audit output.
      - Remaining temporal assumptions.
    forbidden:
      - Promoting forward-looking claims without split evidence.

  - id: claim_guardian
    path: Structural Deformation Research System/src/claims/claim_guard.py
    activate_when:
      - Editing claim registry, paper language, abstracts, conclusions, reports, or public-facing summaries.
      - Text includes validation, early-warning, outperformance, singular-regime, or portfolio language.
    scope:
      - Claim class.
      - Claim maturity.
      - Required disclosures.
      - Replacement language.
    outputs:
      - Claim review artifact.
      - Allowed or rejected wording.
      - Required disclosures.
    forbidden:
      - Approving portfolio language without portfolio validation.
      - Approving early-warning claims without OOS and baseline evidence.

  - id: paper_claim_calibration
    path: Structural Deformation Research System/prompts/prism/paper_claim_calibration.md
    activate_when:
      - Editing papers, abstracts, empirical sections, figure captions, or paper-facing report prose.
      - Translating diagnostics into publication language.
    scope:
      - Paper wording.
      - Claim maturity alignment.
      - Weakened language where evidence is provisional.
    outputs:
      - Calibrated paper text.
      - Claim registry references.
      - Unsupported claim list.
    forbidden:
      - Expanding empirical claims.
      - Calling diagnostic proxies theorems.

  - id: reference_hygiene
    path: Structural Deformation Research System/prompts/prism/reference_hygiene.md
    activate_when:
      - Adding citations, references, source notes, literature sections, or corpus-derived claims.
      - Paper text depends on external reports, PDFs, websites, or institutional materials.
    scope:
      - Reference provenance.
      - Citation hygiene.
      - Narrative evidence versus formal data.
    outputs:
      - Reference hygiene note.
      - Source classification.
      - Missing citation list.
    forbidden:
      - Treating narrative references as proxy-core market data.

  - id: wiki_maintainer
    path: Structural Deformation Research System/prompts/wiki_maintainer
    activate_when:
      - Editing wiki variables, mechanisms, cases, institutions, datasets, methods, or crosslinks.
      - Compiling raw notes into wiki pages.
    scope:
      - Wiki structure.
      - Crosslinks.
      - Claim registry alignment.
      - Evidence references.
    outputs:
      - Updated wiki artifact.
      - Crosslink or registry note.
      - Open evidence gaps.
    forbidden:
      - Creating formal empirical claims outside the claim registry.
      - Treating wiki interpretation as data.

  - id: referee_proxy_validity
    path: Structural Deformation Research System/prompts/referee/proxy_validity_audit.md
    activate_when:
      - Before promoting proxy changes into reports, papers, or claim language.
      - When a proxy has weak trace quality, missingness, frequency mismatch, or channel cross-loading risk.
    scope:
      - Observable trace quality.
      - Control saturation.
      - Channel cross-loading.
      - Missingness and frequency policy.
      - Case coherence.
    outputs:
      - Proxy validity audit.
      - Promotion, weaken, or reject recommendation.
      - Evidence gaps.
    forbidden:
      - Producing the promoted claim itself.

  - id: referee_benchmark_dominance
    path: Structural Deformation Research System/prompts/referee/benchmark_dominance_audit.md
    activate_when:
      - A task mentions outperformance, dominance, incremental information, baseline rank, or benchmark comparison.
      - A report or paper promotes Sigma_t against NFCI, VIX, MOVE, STLFSI, OFR FSI, or similar controls.
    scope:
      - Benchmark dominance evidence.
      - Baseline rank.
      - Incremental information.
      - Falsification risks.
    outputs:
      - Benchmark dominance audit.
      - Accepted, weakened, or rejected language.
      - Required additional tests.
    forbidden:
      - Treating one case or run as global dominance proof.

  - id: referee_fatal_objection
    path: Structural Deformation Research System/prompts/referee/fatal_objection_audit.md
    activate_when:
      - Before release, paper submission, public memo publication, or major claim promotion.
      - When cross-layer coupling creates high-risk overclaim, circularity, benchmark leakage, or unsupported evidence.
    scope:
      - Overclaim.
      - Circularity.
      - Benchmark leakage.
      - Unsupported evidence.
    outputs:
      - Fatal objection audit.
      - Blockers and required repairs.
      - Residual risk note.
    forbidden:
      - Promoting exploratory outputs without approval.

  - id: ui_contract
    path: Structural Deformation Research System/docs/contracts/ui_contract.md
    activate_when:
      - Editing UI, runtime viewer, report viewer, dashboard, or public display surfaces.
      - UI code imports or appears to compute data, proxies, diagnostics, or derivation.
    scope:
      - Thin viewer boundary.
      - Finalized run package inputs.
      - Forbidden imports.
    outputs:
      - UI boundary note.
      - Import boundary evidence.
      - UI or architecture test output.
    forbidden:
      - UI fetching external data.
      - UI computing proxies or diagnostics.
      - UI importing Harvester or Deformation derivation internals.

  - id: harvester_boundary
    path: Structural Risk Harvester/contracts/access_protocol.md
    activate_when:
      - Editing Harvester acquisition, provenance, catalog, manifests, exports, or audit index.
      - Deformation consumes Harvester releases.
    scope:
      - Provider collection.
      - Provenance.
      - Immutable release bundles.
      - Access protocol.
    outputs:
      - Harvester provenance or access note.
      - Manifest/catalog evidence.
      - Hash/schema validation status.
    forbidden:
      - Encoding Deformation theory or claim registry semantics into Harvester.

  - id: learning_hub_cartographer
    path: System Learning Hub/src/governance/codebase
    activate_when:
      - Architecture boundaries change.
      - New drift, forbidden import, oversized module, or recurrence pattern is suspected.
      - A routing decision should become a learning input.
    scope:
      - Read-only codebase structure.
      - Drift detection.
      - Improvement queue inputs.
    outputs:
      - Codebase structure report.
      - Architecture drift report.
      - Learning Hub event or routing decision record.
    forbidden:
      - Fetching data, computing proxies, writing paper claims, or modifying subsystem code.

coupling_rules:
  - id: proxy_to_claim
    trigger: Proxy, benchmark, or diagnostic changes alter interpretation language.
    add_experts:
      - proxy_boundary
      - claim_guardian
      - paper_claim_calibration
    reason: Diagnostic implementation and claim wording are coupled.

  - id: data_to_proxy
    trigger: New data source, adapter, manifest, or frequency policy affects proxy inputs.
    add_experts:
      - datahub_implementation
      - proxy_boundary
      - no_lookahead_tests
    reason: Data admission affects structural proxy validity.

  - id: ui_to_governance
    trigger: UI displays evidence, diagnostics, claims, or paper-facing language.
    add_experts:
      - ui_contract
      - claim_guardian
    reason: Display surfaces can accidentally promote outputs.

  - id: release_to_referee
    trigger: Publishing a run, report, paper draft, or public memo.
    add_experts:
      - referee_fatal_objection
    reason: Release surfaces need independent verification.

  - id: harvester_to_deformation
    trigger: Deformation consumes a Harvester export or Harvester changes exported schema.
    add_experts:
      - harvester_boundary
      - datahub_implementation
    reason: Cross-system data boundary must remain auditable.

routing_artifacts:
  default_template: routing_decision_record.template.yaml
  preferred_locations:
    - Output/system_learning/routing_decisions/
    - Output/deformation_runs/<run_id>/learning/
    - System Learning Hub/reports/codebase/latest/
  required_fields:
    - task_id
    - date
    - artifacts_touched
    - activated_experts
    - intentionally_not_activated
    - verification
    - outputs
    - unresolved_risks

