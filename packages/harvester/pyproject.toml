[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-risk-harvester"
version = "0.1.0"
description = "Immutable, manifest-backed data bundles for the Structural Deformation Research System."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=0.10",
    "jsonschema>=4.26.0",
    "pandas>=2.0",
    # harvester.quality imports pandera at runtime for structured diagnostics;
    # without this declaration `uv sync --all-packages` omits it and every
    # contract report degrades to pandera="unavailable".
    "pandera>=0.20",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "httpcore>=1.0,<2",
    "httpx>=0.27,<1",
    "lxml>=5.0",
    "openpyxl>=3.1",
    # The ETF chain's bounded last-resort provider is part of the scheduled
    # runtime, not an undeclared optional import.  Tiingo/Massive remain the
    # preferred authenticated sources; yfinance is only used after those
    # attempts fail and its provenance is recorded per ticker.
    "yfinance>=1.5,<2",
]

[project.optional-dependencies]
dlt = [
    "dlt>=1.30,<2",
]
openbb = [
    "openbb>=4.7,<5",
]
sdk = [
    "openbb>=4.7,<5",
    "fredapi>=0.5",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
harvester = "harvester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
