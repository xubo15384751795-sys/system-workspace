# Named specialist roles for sparse activation (aligned with ROUTING_CONSTITUTION.md).
# Use harness agent modes + subsystem boundaries; do not replace expert_activation_map.yaml.
#
# Maps conceptual roles to:
#   harness_mode: value passed to Structural Research Harness tool registry
#   subsystem_focus: primary artifact layer
#   read_only: must not mutate canonical Data/ or finalize releases without verification path

roles:
  explore_readonly:
    description: >
      Codebase and manifest exploration only; Glob/Grep-style reads, inspect-release,
      list-snapshots. No writes to Data/, no release finalization.
    harness_mode: explore
    subsystem_focus: workbench_read
    read_only: true

  plan_architect:
    description: >
      Produces step-by-step plans and critical-files lists; does not execute mutations
      or promote snapshots (Plan-like separation from execution).
    harness_mode: explore
    subsystem_focus: routing_documentation
    read_only: true

  implement_release:
    description: >
      Harvester export paths, bundle builds, and deformation runs that mutate run-local
      Output; must stay inside Tool specs and permissions.
    harness_mode: implement
    subsystem_focus: harvester_and_deformation_tooling
    read_only: false

  verify_adversarial:
    description: >
      Runs validation tools, replay checks, contract validators; treats PASS as suspect
      until commands and outputs are observed (Verification-like discipline).
    harness_mode: verify
    subsystem_focus: validation_and_benchmarks
    read_only: true

  governance_queue:
    description: >
      Writes Learning Hub events, improvement queue entries, routing_decision records —
      observability and gaps, not canonical theory or promotions.
    harness_mode: run
    subsystem_focus: system_learning_hub
    read_only: false

promotion_flow_summary: |
  External providers -> Harvester release -> Data/harvester/exports/<id>/ ->
  Deformation via data_access -> Output/deformation_runs/<run_id>/ ->
  explicit promotion -> Data/deformation/snapshots/<snapshot_id>.json
