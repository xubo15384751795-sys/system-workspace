schema_version: workbench.provider_release_calendar.v1
description: >-
  Official provider publication schedules used as a shadow freshness clock.
  This file supplies expected release times only; an event still needs an
  explicit available_at timestamp before it can be decision-usable.
default_timezone: America/New_York
mode: shadow
rules:
  - rule_id: h41.weekly_public_release
    provider_id: h41
    series_id: "*"
    dataset_id: official_panel
    evidence_status: verified
    observation_weekday: 2
    release_offset_days: 1
    release_weekday: 3
    release_timezone: America/New_York
    release_cutoff_local: "16:30"
    nominal_publication_lag: PT0S
    business_calendar_basis: US_FEDERAL
    official_evidence_url: https://www.federalreserve.gov/releases/h41/
    evidence_checked_at: "2026-08-24"
    note: >-
      H.4.1 is generally released Thursday at 4:30 p.m. Eastern. The Federal
      Reserve says a federal-holiday release moves to the next business day.

  - rule_id: cftc.tff.weekly_public_release
    provider_id: external_public
    provider_aliases:
      - cftc
    series_id: CFTC_TFF_LEV_SP
    dataset_id: benchmark_panel
    evidence_status: verified
    observation_weekday: 1
    release_offset_days: 3
    release_weekday: 4
    release_timezone: America/New_York
    release_cutoff_local: "15:30"
    nominal_publication_lag: PT0S
    business_calendar_basis: US_FEDERAL
    official_evidence_url: https://www.cftc.gov/MarketReports/CommitmentsofTraders/ReleaseSchedule/index.htm
