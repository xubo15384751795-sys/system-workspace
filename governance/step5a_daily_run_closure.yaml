      - tests/test_project_identity.py
      - tests/test_step5a_daily_run_parity.py::test_dr01_dry_run_compiles_the_runtime_plan_without_publication
    status: PASS
    gap: none; dry-run has an explicit no-bundle/no-publication contract and returns the stable dry_run identity

