schema_version: validation_roadmap.v1
updated_at: "2026-07-30"
authority:
  definition: governance/progress/validation_roadmap.yaml
  event_log: governance/progress/validation_progress_events.jsonl
  human_view: PROJECT_PROGRESS.md
  policy: >
    Task state and completion are derived from validated append-only events.
    Percentages must not be edited directly in generated views.

criterion_status_factors:
  not_started: 0.0
  in_progress: 0.5
  satisfied: 1.0
  blocked: 0.0
  failed: 0.0

states:
  - PLANNED
  - READY
  - IN_PROGRESS
  - CODE_COMPLETE
  - CI_GREEN
  - OPERATIONAL_VALIDATION
  - EVIDENCE_ACCUMULATING
  - VERIFIED
  - CLOSED
  - BLOCKED
  - DEFERRED
  - FAILED
  - CANCELLED

transitions:
  PLANNED: [READY, DEFERRED, CANCELLED]
  READY: [IN_PROGRESS, BLOCKED, DEFERRED, CANCELLED]
  IN_PROGRESS: [CODE_COMPLETE, BLOCKED, FAILED, DEFERRED, CANCELLED]
  CODE_COMPLETE: [CI_GREEN, IN_PROGRESS, BLOCKED, FAILED]
  CI_GREEN: [OPERATIONAL_VALIDATION, IN_PROGRESS, BLOCKED, FAILED]
  OPERATIONAL_VALIDATION: [EVIDENCE_ACCUMULATING, CI_GREEN, BLOCKED, FAILED]
  EVIDENCE_ACCUMULATING: [VERIFIED, OPERATIONAL_VALIDATION, BLOCKED, FAILED]
  VERIFIED: [CLOSED, EVIDENCE_ACCUMULATING, BLOCKED]
  CLOSED: []
  BLOCKED:
    - READY
    - IN_PROGRESS
    - CODE_COMPLETE
    - CI_GREEN
    - OPERATIONAL_VALIDATION
    - EVIDENCE_ACCUMULATING
    - DEFERRED
    - CANCELLED
  DEFERRED: [READY, IN_PROGRESS, CANCELLED]
  FAILED: [IN_PROGRESS, DEFERRED, CANCELLED]
  CANCELLED: []

tasks:
  - id: P0-1
    title: 定期 CI 与合并强制
    phase: P0
    owner: System
    roadmap_section: 4
    overall_weight: 10
    criteria:
      - {id: workflow_repair, title: Nightly/Weekly 路径和安装口径修复, weight: 20}
      - {id: merge_enforcement, title: 私有仓库替代合并强制, weight: 15}
      - {id: failure_injection, title: 缺失路径和产物能够阻断, weight: 15}
      - {id: nightly_green, title: 当前主线 Nightly 绿色, weight: 10}
      - {id: weekly_green, title: 当前主线 Weekly 绿色, weight: 10}
      - {id: fourteen_day_window, title: 连续 14 天定期运行全绿, weight: 30}

  - id: P0-2
