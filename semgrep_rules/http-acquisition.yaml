rules:
  - id: direct-http-acquisition-in-deformation
    patterns:
      - pattern-either:
          - pattern: |
              urlopen($URL)
          - pattern: |
              import requests
          - pattern: |
              import httpx
      - pattern-not-regex: .*data_sources.*
      - pattern-not-regex: .*public_adapters.*
      - pattern-not-regex: .*data_hub.*
    message: >
      Direct HTTP outside an owned gateway violates DATA_BOUNDARY.md.
    severity: WARNING
    languages:
      - python
    paths:
      exclude:
        - '**/packages/framework_v1_archive/src/data_access/http_gateway.py'
        - '**/packages/harvester/src/harvester/http_gateway.py'
        - '**/system_runtime/external_http.py'
        - '**/packages/workbench/src/workbench/external_http.py'
