# Nightly Full Pipeline — comprehensive validation including all module tests.
#
# Runs daily at 05:00 UTC. Covers everything:
#   - All 4 package test suites (independent)
#   - Root contract tests
#   - Full daily pipeline dry-run (33+ steps)
#   - Architecture boundary audit
#   - Operator registry audit
#   - Schema validation
#
# This is the safety net that catches drift between modules.
#
# 2026-07-07: Submodules consolidated into packages/ — no submodule checkout needed.

name: Nightly Full Pipeline

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:

jobs:
  # ── Per-module tests (parallel) ─────────────────────────────────────────

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e "packages/workbench[dev]"
      - name: Run Workbench tests
        working-directory: packages/workbench
        run: pytest tests/ -q --tb=short

  deformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e "packages/framework[dev]"
      - name: Run deformation-framework tests
        working-directory: packages/framework
        run: pytest tests/ -q --tb=short

  harvester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e "packages/harvester[dev]"
      - name: Run harvester tests
        working-directory: packages/harvester
        run: pytest tests/ -q --tb=short

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - run: |
          pip install --upgrade pip
          pip install -e "packages/learning_hub[dev]"
      - name: Run learning-hub tests
        working-directory: packages/learning_hub
        run: pytest tests/ -q --tb=short

  # ── Full integration (gates on all module tests) ────────────────────────

  full-integration:
    needs: [workbench, deformation, harvester, hub]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml
            requirements-dev.txt
      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "packages/workbench[dev]"
          pip install -e "packages/framework[dev]"
          pip install -e "packages/harvester[dev]"
          pip install -e "packages/learning_hub[dev]"
      - name: Root contract tests
        run: python -m pytest tests/ -q --tb=short
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Daily pipeline dry-run
        run: python scripts/daily_run.py --dry-run
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Architecture boundary audit
        run: python scripts/architecture_reality_audit.py --json
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Operator registry audit (offline)
        run: python scripts/operator_registry_audit.py --json
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Schema validation
        run: |
          python -c "
          import json
          from pathlib import Path
          try:
              import jsonschema
          except ImportError:
              print('ERROR: jsonschema not installed — cannot validate schemas')
              exit(1)

          root = Path('.')
          errors = []

          fw_path = root / 'Output' / 'current' / 'framework_output.json'
          schema_path = root / 'governance' / 'framework_output.schema.json'
          if fw_path.exists() and schema_path.exists():
              data = json.loads(fw_path.read_text())
              schema = json.loads(schema_path.read_text())
              try:
                  jsonschema.validate(data, schema)
                  print('framework_output.json: PASS')
              except jsonschema.ValidationError as e:
                  errors.append(f'framework_output.json: {e.message}')
                  print(f'framework_output.json: FAIL — {e.message}')

          status_path = root / 'Output' / 'current' / 'status.json'
          card_schema_path = root / 'protocols' / 'current_card.schema.json'
          if status_path.exists() and card_schema_path.exists():
              data = json.loads(status_path.read_text())
              schema = json.loads(card_schema_path.read_text())
              try:
                  jsonschema.validate(data, schema)
                  print('status.json: PASS')
              except jsonschema.ValidationError as e:
                  errors.append(f'status.json: {e.message}')
                  print(f'status.json: FAIL — {e.message}')

          if errors:
              print(f'Schema validation failed: {len(errors)} error(s)')
              exit(1)
          print('All schema validations passed.')
          "
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Experiment → core judgment check
        run: python scripts/verify_experiment_core_judgment.py
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Output freshness check
        run: python scripts/check_output_freshness.py
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
      - name: Type check
        run: python -m mypy scripts/ --ignore-missing-imports --no-error-summary
        env:
          PYTHONPATH: "packages/workbench/src:scripts"
