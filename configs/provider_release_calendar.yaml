      - "2026-11-30"
      - "2026-12-04"
      - "2026-12-11"
      - "2026-12-18"
      - "2026-12-28"
    note: >-
      TFF is a COT report. CFTC documents the public release at 3:30 p.m.
      Eastern, normally Friday using the preceding Tuesday's data; the dated
      schedule above is authoritative for 2026 holiday shifts.

  # Tiingo US equity/ETF EOD is a weekday schedule. One rule per session
  # weekday because the calendar schema binds a single observation_weekday.
  # Official docs: most US equity prices are available at 5:30 PM EST;
  # exchanges may send corrections until 8:00 PM EST.
  # https://www.tiingo.com/documentation/end-of-day
  # https://www.tiingo.com/products/end-of-day-stock-price-data
  - rule_id: tiingo.cross_asset_daily_panel.mon
    <<: *tiingo_cross_asset_daily_eod
    observation_weekday: 0
    release_weekday: 0
  - rule_id: tiingo.cross_asset_daily_panel.tue
    <<: *tiingo_cross_asset_daily_eod
    observation_weekday: 1
    release_weekday: 1
  - rule_id: tiingo.cross_asset_daily_panel.wed
    <<: *tiingo_cross_asset_daily_eod
    observation_weekday: 2
    release_weekday: 2
  - rule_id: tiingo.cross_asset_daily_panel.thu
    <<: *tiingo_cross_asset_daily_eod
    observation_weekday: 3
    release_weekday: 3
  - rule_id: tiingo.cross_asset_daily_panel.fri
    <<: *tiingo_cross_asset_daily_eod
    observation_weekday: 4
    release_weekday: 4
