schema_version: governance.layout_contract.v1
status: PASS_WITHOUT_CLEANUP
scope: layout_contract_only
destructive_operation_performed: false
environments:
  source_checkout:
    role: development repository
    allows:
    - source
    - tests
    - governance
    - compatibility symlink
    - development tooling
  source_archive:
    role: zip/tar release
    symlink_policy: preserve only explicitly classified compatibility links; do not
      dereference mutable Data/Output or external absolute links
    generated_artifacts: excluded unless named in the release manifest
  installed_runtime:
    role: uv-installed environment
    source: formal package/install resources only
    forbidden_sources:
    - build/
    - dist/
    - accidental copied package trees
    - checkout-only aliases
  build_dist:
    role: temporary packaging output
    allows:
    - wheel
    - sdist
    - generated build artifacts
    runtime_source: false
canonical_sources:
- name: harvester
  path: packages/harvester
  owner: Harvester
- name: learning_hub
  path: packages/learning_hub
  owner: Learning Hub
- name: workbench
  path: packages/workbench
  owner: Workbench
- name: orchestration
  path: packages/orchestration
  owner: Orchestration
- name: system_runtime
  path: system_runtime
  owner: System runtime
compatibility_alias_policy:
  root_package_aliases:
  - Structural Research Harness
  - Structural Risk Harvester
  - System Learning Hub
  - contracts
  installed_runtime_must_not_resolve_through_aliases: true
  broken_or_external_legacy_aliases_are_migration_items: true
generated_artifact_destinations:
  build: build/
  dist: dist/
  runtime_plan: Output/runs/<run_id>/compiled_runtime_plan.json
  production_generation: Output/generations/<generation_id>/
  source_archive: release manifest only
automated_checks:
  reader: tools/audit/layout_contract.py
  no_installed_runtime_import_from_build: PASS
  no_production_read_from_accidental_copied_package_tree: PASS
  compatibility_link_resolves: PASS
  canonical_source_unique: PASS
  all_relevant_symlinks_classified: PASS
  unapproved_deletion: PASS
