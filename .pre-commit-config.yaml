# Pre-commit hooks — minimal gate, no heavy formatters.
# Install:  pre-commit install
# Run all:  pre-commit run --all-files
#
# This is intentionally lightweight: trailing whitespace, EOF fixers,
# and YAML/JSON syntax checks only.  No black/ruff yet — add those
# separately when the codebase is ready for a formatting pass.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
