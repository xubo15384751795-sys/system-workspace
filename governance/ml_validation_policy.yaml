# classification: documentation-only
schema_version: ml_validation_policy.v1
updated_at: "2026-06-20"
purpose: >
  Govern the allowed use of ML validation outputs. These are review-only
  diagnostics and must NEVER be consumed as primary input to core judgment,
  trade decisions, or signal generation.

validation_outputs:
  - path: "Output/validation/walk_forward_report.json"
    producer: scripts/commands/weekly/weekly_walk_forward_validation.py
    schedule: weekly
    allowed_use: validation_only
    can_affect_core_judgment: false
    can_affect_trade_decision: false
    can_affect_signals: false
    notes: "Rolling-origin OOS diagnostics. Review-only. Never feeds judgment."

  - path: "Output/validation/baseline_comparison.json"
    producer: scripts/commands/weekly/baseline_comparison.py
    schedule: weekly
    allowed_use: validation_only
    can_affect_core_judgment: false
    can_affect_trade_decision: false
    can_affect_signals: false
    notes: "System vs naive baselines. Review-only."

  - path: "Output/system_learning/latest/threshold_review_candidates.json"
    producer: scripts/commands/weekly/threshold_review_bridge.py
    schedule: weekly
    allowed_use: human_review_only
    can_affect_core_judgment: false
    can_affect_trade_decision: false
    notes: "Never auto-applies threshold changes. Surfaces candidates for human review."

  - path: "Output/quality/asof_integrity_report.json"
    producer: scripts/commands/weekly/asof_integrity_checker.py
    schedule: weekly
    allowed_use: validation_only
    can_affect_core_judgment: false
    can_affect_trade_decision: false
    notes: "Future-data leakage detection. Warning-only."

  - path: "Output/validation/qlib_structural_bridge.json"
    producer: scripts/commands/weekly/build_qlib_structural_bridge.py
    schedule: weekly
    allowed_use: validation_only
    can_affect_core_judgment: false
    can_affect_trade_decision: false
    can_affect_signals: false
    notes: "Qlib experiment vs structural backtest bridge. Review-only."

  - path: "Output/strategy_lab/shadow_outcomes_90d.json"
    producer: scripts/build_shadow_outcomes_90d.py
    schedule: weekly
    allowed_use: validation_only
    can_affect_core_judgment: false
    can_affect_trade_decision: false
    can_affect_signals: false
    notes: "Shadow gate outcome aggregation. Review-only."

enforcement:
  forbidden_consumers:
    - scripts/judgment_layer.py
    - scripts/trade_decision_layer.py
    - packages/workbench/src/workbench/judgment/layer.py
  rule: >
    No script in scripts/ or packages/workbench/ may read files from Output/validation/
    as input to build_judgment(), build_decision(), or signal generation.
    These outputs are review-only diagnostics.
