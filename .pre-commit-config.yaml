# Pre-commit hooks — minimal gate + lint-only ruff.
# Install:  pre-commit install
# Run all:  pre-commit run --all-files
#
# Ruff is lint-only here (no auto-format).  Add ruff-format or black
# separately when the codebase is ready for a formatting pass.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--select, E,F,W,I, --ignore, E501,E402]
