  always_read_files_max: 1
  procedural_rule_files_max: 1
  actual_at_acceptance:
    governance_root_files: 42
    executable_invariants: 30
    feedback_loops: 4
implementation:
  - system_runtime/paths.py: WorkspacePaths.harvester_exports property
  - packages/harvester/src/harvester/core/exporter.py: default_exports_root via WorkspacePaths
  - scripts/_replay_registry.py: _verify_release_if_under_exports before panel read
  - governance/repo_layout_map.md: §8 alias documentation
