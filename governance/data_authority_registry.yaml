schema_version: data_authority.v1
created: "2026-06-17"
purpose: >
  Mark non-Harvester data sources with authority level.
  Harvester is the canonical data authority. Non-Harvester data is allowed
  only as marked transitional/research evidence.
  Unmarked non-Harvester data cannot affect core judgment.

entries:
  - path: Data/panels/cross_asset_daily_panel.parquet
    authority: non_harvester_transitional
    owner: Workbench Signals
    allowed_use: [research, training, feedback]
    forbidden_use: [core_judgment_primary_input]
    data_request_id: etf_cross_asset_panel
    note: "ETF panel; Harvester openbb_yfinance series pending integration"

  - path: Data/panels/cross_asset_daily_panel.csv.gz
    authority: export_only
    owner: Workbench Signals
    allowed_use: [export]
    forbidden_use: [core_judgment_primary_input, research]
    note: "CSV is export-only; parquet is canonical"

  - path: Data/merged_data/benchmark_panel_with_etfs.parquet
    authority: migration_artifact
    owner: Deformation Framework
    allowed_use: [research]
    forbidden_use: [core_judgment_primary_input]
    data_request_id: merged_data_proxy_inputs
    note: "Migration artifact; must be consolidated into Harvester release"

  - path: Data/merged_data/benchmark_panel_backup.parquet
    authority: migration_artifact
    owner: Deformation Framework
    allowed_use: [archive]
    forbidden_use: [core_judgment_primary_input, research]

  - path: Data/merged_data/benchmark_panel_merged.parquet
    authority: migration_artifact
    owner: Deformation Framework
    allowed_use: [archive]
    forbidden_use: [core_judgment_primary_input, research]

  - path: Data/structural_lab/runtime/system.duckdb
    authority: legacy_runtime_store
    owner: Deformation Framework
    allowed_use: [runtime_snapshot]
    forbidden_use: []
    note: "46MB DuckDB; actively used by DuckDBSnapshotStore"
    deferred_work_id: duckdb_snapshot_store_migration

  - path: Data/structural_lab/runtime/fred_cache/
    authority: legacy_runtime_cache
    owner: Deformation Framework
    allowed_use: [runtime_cache]
    forbidden_use: [core_judgment_primary_input]
    data_request_id: fred_cached_data
    note: "FRED data available through Harvester official release"

  - path: Data/benchmarks/us_etf_prices.csv
    authority: non_harvester_transitional
    owner: ML Signals
    allowed_use: [research, benchmark]
    forbidden_use: [core_judgment_primary_input]
    note: "ETF prices for benchmark comparison"
