# Nightly Full Pipeline — comprehensive validation including all module tests.
#
# Runs daily at 05:00 UTC. Covers everything:
#   - All 4 package test suites (independent)
#   - Root contract tests
#   - Full daily pipeline dry-run (33+ steps)
#   - Architecture boundary audit
#   - Operator registry audit
#   - Schema validation (fail-closed when current artifacts missing)
#
# This is the safety net that catches drift between modules.
#
# 2026-07-07: Submodules consolidated into packages/ — no submodule checkout needed.
# 2026-07-27: P0-1 — repair migrated weekly script paths; unify install/PYTHONPATH;
#             schema/freshness fail-closed for scheduled depth checks.

name: Nightly Full Pipeline

permissions:
  contents: read

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:

env:
  PYTHONPATH: ".:packages/workbench/src:scripts"

jobs:
  # ── Per-module tests (parallel) ─────────────────────────────────────────

  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Run Workbench tests
        run: uv run --locked python -m pytest packages/workbench/tests/ -q --tb=short --durations=25

  archive-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages --extra viz
      - name: Isolated archived Deformation reproduction
        working-directory: packages/framework_v1_archive
        env:
          ALLOW_ARCHIVED_DEFORMATION_REPRODUCTION: "1"
          CURRENT_OUTPUT_DIR: ${{ runner.temp }}/archived-deformation-current
          PYTHONPATH: "src"
        run: |
          mkdir -p "$CURRENT_OUTPUT_DIR"
          uv run --locked --directory "$GITHUB_WORKSPACE" \
            --package structural-deformation-research-system \
            python -m pytest tests/ -q --tb=short --durations=25

  harvester:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Run harvester tests
        run: uv run --locked python -m pytest packages/harvester/tests/ -q --tb=short --durations=25

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Run learning-hub tests
        run: uv run --locked python -m pytest packages/learning_hub/tests/ -q --tb=short --durations=25

  # ── Full integration (gates on all module tests) ────────────────────────

  full-integration:
    needs: [workbench, harvester, hub]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
          python-version: ["3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Path existence smoke
        run: |
          set -euo pipefail
          for path in \
            scripts/commands/weekly/architecture_reality_audit.py \
            scripts/commands/weekly/operator_registry_audit.py \
            scripts/daily_run.py \
            scripts/verify_merge.py \
            scripts/check_output_freshness.py \
            scripts/commands/ci/validate_current_schemas.py
          do
            test -f "$path" || { echo "MISSING: $path"; exit 1; }
            echo "OK: $path"
          done
      - name: Root contract tests (pytest classification is authoritative)
        run: uv run --locked python -m pytest tests/ -q --tb=short --durations=25
      - name: Daily pipeline dry-run
        run: uv run --locked python scripts/daily_run.py --dry-run
      - name: Architecture boundary audit
        run: uv run --locked python scripts/commands/weekly/architecture_reality_audit.py --json
      - name: Operator registry audit (offline)
        run: uv run --locked python scripts/commands/weekly/operator_registry_audit.py --json
      - name: Schema validation (clean runner N/A; never fake PASS)
        run: uv run --locked python -m scripts.commands.ci.validate_current_schemas --ci-clean-checkout
      - name: Experiment → core judgment check
        run: uv run --locked python scripts/verify_experiment_core_judgment.py
      - name: Output freshness check (clean runner N/A; never fake PASS)
        run: uv run --locked python scripts/check_output_freshness.py --ci-clean-checkout --json
      - name: Governance boundary type check
        run: >-
          uv run --locked python -m mypy
          scripts/check_governance_freeze.py
          scripts/_deformation_archive_guard.py
          scripts/verify_experiment_core_judgment.py
          --follow-imports=skip
          --ignore-missing-imports
          --no-error-summary
