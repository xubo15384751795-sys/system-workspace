        reason: "TDA integration requires empirical validation period"
        execution_window: "1 day (set proof period config)"
        evidence_window: "30 days (observe TDA stub behavior)"
        review_date: "2026-08-01"
      - id: ui_smoke_tests
        title: "UI tests — add smoke test"
        owner: Workbench
        status: deferred
        reason: "No UI test infrastructure exists yet"
        execution_window: "2-3 days (write smoke tests)"
