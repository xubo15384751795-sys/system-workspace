# Weekly Governance Check — deep governance validation every Monday.
#
# Complements the per-push CI Minimal Gate with:
#   - Derived governance artifact builds (freeze, authority graph, entrypoint registry)
#   - Governance + pipeline contract tests
#   - Full daily pipeline dry-run
#   - Architecture reality audit
#   - Operator registry audit
#
# 2026-07-07: Submodules consolidated into packages/ — no submodule checkout needed.
# 2026-07-27: P0-1 — repair migrated weekly script paths; unify install/PYTHONPATH;
#             schema/freshness fail-closed for scheduled depth checks.

name: Weekly Governance Check

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 03:00 UTC
  workflow_dispatch:

env:
  PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"

jobs:
  governance-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev]"
          python -m pip install -e "packages/workbench[dev]"
          python -m pip install -e "packages/framework[dev]"
          python -m pip install -e "packages/harvester[dev]"
          python -m pip install -e "packages/learning_hub[dev]"

      - name: Path existence smoke
        run: |
          set -euo pipefail
          for path in \
            scripts/commands/weekly/architecture_reality_audit.py \
            scripts/commands/weekly/operator_registry_audit.py \
            scripts/commands/weekly/build_authority_graph.py \
            scripts/daily_run.py \
            scripts/verify_merge.py \
            scripts/check_output_freshness.py \
            scripts/commands/ci/validate_current_schemas.py \
            scripts/build_entrypoint_registry.py \
            scripts/check_governance_freeze.py
          do
            test -f "$path" || { echo "MISSING: $path"; exit 1; }
            echo "OK: $path"
          done

      - name: Check governance freeze
        run: python scripts/check_governance_freeze.py

      - name: Build derived governance artifacts
        run: |
          # build_incentive_review.py is archived (entrypoint_registry) and removed;
          # do not resurrect a missing required step as a silent skip.
          python scripts/commands/weekly/build_authority_graph.py --fail-on-invariant
          python scripts/build_entrypoint_registry.py

      - name: Governance and pipeline contract tests
        run: >
          python -m pytest
          tests/test_daily_run_sequence.py
          tests/test_governance_runtime_contracts.py
          tests/test_authority_graph.py
          tests/test_governance_freeze.py
          tests/test_incentive_engine.py
          -q --tb=short

      - name: Daily pipeline dry-run
        run: python scripts/daily_run.py --dry-run

      - name: Architecture reality audit
        run: python scripts/commands/weekly/architecture_reality_audit.py --json

      - name: Operator registry audit (offline)
        run: python scripts/commands/weekly/operator_registry_audit.py --json

      - name: Schema validation (clean runner N/A; never fake PASS)
        run: python -m scripts.commands.ci.validate_current_schemas --ci-clean-checkout

      - name: Experiment → core judgment check
        run: python scripts/verify_experiment_core_judgment.py

      - name: Output freshness check (clean runner N/A; never fake PASS)
        run: python scripts/check_output_freshness.py --ci-clean-checkout --json

      - name: Learning Hub ingest and monitoring blind-spot audit
        env:
          PYTHONPATH: ".:packages/learning_hub/src:packages/framework/src:packages/workbench/src:scripts"
        run: |
          python scripts/run_learning_hub_ingest.py
          # Clean Actions checkout has no operator Output coverage; --strict is
          # for operator/post-refresh workspaces (P0-4). Still emit the report.
          python scripts/artifact_monitoring_audit.py

      - name: Learning Hub variation inlet health
        env:
          PYTHONPATH: ".:packages/learning_hub/src:packages/framework/src:packages/workbench/src:scripts"
        run: python -m system_learning variation-health --system-root "${{ github.workspace }}"
