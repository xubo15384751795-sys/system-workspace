[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.2.0"
description = "Verity evidence-governed research kernel"
requires-python = ">=3.13,<3.14"

# Core runtime dependencies (shared across all submodules)
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.26.0",
    "pandas>=2.0",
    "numpy>=2.5.2",
    "exchange-calendars>=4.5,<5",
    "scikit-learn>=1.9.0",
    "omegaconf>=2.4.0.dev15",
    "mcp>=1.23,<2",
    "httpcore>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
verity = "system_cli.app:main"
# Compatibility entrypoint retained for existing operators and launchd jobs.
system = "system_cli.app:main"

[project.optional-dependencies]
ml = [
    "hmmlearn>=0.3",
    "mcp>=1.23,<2",
]
orchestration = [
    "dagster>=1.13.19",
    "dagster-webserver>=1.9",
    "pandera>=0.20",
    "exchange-calendars>=4.5,<5",
    "dvc>=3.50",
    "streamlit>=1.62.0",
    "lancedb>=0.12",
    "sentry-sdk>=2.68.0",
]
observability = [
    "sentry-sdk>=2.68.0",
]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.26.0",
    "pandas>=2.0",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "omegaconf>=2.4.0.dev15",
    "hmmlearn>=0.3",
]
full = [
    "verity[ml,dev,orchestration]",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.12",
    "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "system_cli*",
    "system_runtime*",
    "caselab_context*",
    "caselab_runtime*",
    "scripts*",
]

# The four domain distributions stay independently installable.  Workspace
# tooling installs them together; runtime code imports their public packages
# and never mutates sys.path to reach their source trees.
[tool.uv]
# Keep PEP 517 build requirements aligned with the checked-in build
# constraints used by CI. Runtime dependencies remain governed by uv.lock.
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.48.0"]

[tool.uv.workspace]
members = [
    "packages/framework",
    "packages/harvester",
    "packages/learning_hub",
    "packages/workbench",
    "packages/orchestration",
]

[tool.pytest.ini_options]
# The root project is the single test-classification authority.  Package
# projects remain independently buildable, but their tests inherit this
# hermetic collection policy when run from the workspace or CI.
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [
    ".",
    "packages/harvester/src",
    "packages/learning_hub/src",
    # The workbench owns the canonical ``ml`` package consumed by the root
    # tests and its package suite; keep it ahead of the legacy framework ml
    # namespace retained for framework-only compatibility imports.
    "packages/workbench/src",
    "packages/framework",
    "packages/framework/src",
    "packages/orchestration",
    "scripts",
]
addopts = "-m 'not operator and not network and not external_repo and not slow' --strict-markers"
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "Data",
    "Output",
    "Workbench",
    "Structural Deformation Research System",
    "Structural Risk Harvester",
    "Structural Research Harness",
    "System Learning Hub",
    "contracts",
]
markers = [
    "critical_gate: tests that must pass before promotion (routing, config, authority gates)",
    "semantic: concept registry, proxy semantics, NOT_IMPLEMENTED enforcement",
    "data_boundary: data boundary compliance, freshness, provenance",
    "benchmark: benchmark correctness (Qlib placeholder, real metrics, comparison validity)",
    "report: report verdict gate, export validation",
    "governance_loop: ledger, escalation, incident lifecycle",
    "slow: tests that take >10s, excluded from default runs",
    "operator: tests that require an initialized operator workspace (Data/Output state); excluded by default",
    "network: tests that make live network calls; excluded by default",
    "external_repo: tests that require external repositories (Paper vault, CaseLab fixtures); excluded by default",
]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Generated wheel/build trees are artifacts, not independent source surfaces;
# broad package type checks must not duplicate their copied modules.
exclude = ["(^|/)(build|dist)(/|$)"]
# Package-specific mypy policy lives in the member pyproject files. The root
# project has no legacy submodule exclusions; those paths are not current code.
