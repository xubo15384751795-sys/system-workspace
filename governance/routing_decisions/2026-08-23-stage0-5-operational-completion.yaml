decision:
  dvc_remote: >-
    Keep iCloud Drive as the temporary configured DVC remote until an external
    disk or object-storage remote is available. The workspace uses Python 3.13
    and the matching .venv DVC executable; the previous same-disk localcache
    remote is not selected.
  data_backup: >-
    Treat the dated iCloud Data copy as the current second copy. It is a
    recoverability copy, not immutable backup storage, and must be replaced or
    supplemented by an external disk/object store when available.
  external_sources: >-
    Keep H.4.1 direct Table 1 mappings for discount_window and primary_credit;
    keep BTFP semantically separate and allow its historical FRED graph or
    captured FRED history fallback. Keep SRISK and CoVaR explicitly manual
    sources rather than reporting missing manual files as automated transport
    failures. Keep CFTC on the Socrata resource API with parse-before-cache.
  launchd: >-
    Keep the canonical daily and dead-man jobs loaded. Keep the two historical
    21:30/22:30 harvester records explicitly Disabled=true; they are not silent
    missing jobs and must not be re-enabled in parallel with the 07:00 owner.

