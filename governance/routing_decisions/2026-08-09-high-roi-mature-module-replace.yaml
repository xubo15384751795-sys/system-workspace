schema_version: routing_decision.v1
decision_id: 2026-08-09-high-roi-mature-module-replace
date: "2026-08-09"
status: adopted
summary: >
  In-place cutover of daily/refresh orchestration to Dagster; Pandera+GE for
  content-clock quality; DVC pointer recording for Harvester/snapshot promote;
  Streamlit replaces research_terminal/Visualization; Qlib runner uses workflow
  APIs; CaseLab embeddings ANN backed by LanceDB.
authority_changes:
  - module: packages/orchestration
    claim: owns default-path daily_job and refresh_current_job execution
  - module: scripts/_legacy_daily_run_executor.py
    claim: emergency only via SYSTEM_USE_LEGACY_DAILY_RUN=1
  - module: governance/archive/research_terminal
    claim: archived; not a live operator surface
  - module: governance/archive/Visualization
    claim: archived; not a live operator surface
non_goals:
  - rewrite judgment/trade/neutral_pressure business logic
  - replace claim ladder or Learning Hub semantics
  - replace Output/current atomic publish with DVC
references:
  - packages/orchestration/orchestration/definitions.py
  - packages/orchestration/orchestration/runner.py
  - packages/workbench/src/workbench/ui/streamlit_app.py
  - MODULES.md
