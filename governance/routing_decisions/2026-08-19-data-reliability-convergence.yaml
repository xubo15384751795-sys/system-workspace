schema_version: routing_decision.v1
decision_id: 2026-08-19-data-reliability-convergence
date: "2026-08-19"
cynefin_domain: complicated
status: adopted
summary: >
  Close the data-reliability gap at the Source -> ProviderAttempt ->
  Observation -> Availability -> Measurement boundary without changing
  research thresholds or granting a degraded release decision authority.
scope: >
  Add explicit publication, availability, retrieval, vintage, source-signature,
  and primary-key integrity evidence to Harvester releases. Make incomplete
  public-stress channel baskets fail closed, deduplicate ETF panel keys at
  acquisition and consumer boundaries, preserve source/fallback metadata
  through canonical observations and provenance, and add a typed SourceSpec /
  SourceRoute registry so equivalent sources, transport fallbacks, and
  diagnostic routes cannot be conflated.
decision: >
  Treat retrieval success as UNKNOWN until publication availability is evidenced
  by a configured calendar and an explicit available_at clock. Treat reused or
  carried-forward values as STALE. Keep source changes visible through a stable
  normalization signature and parity helper. Enforce the (symbol, date) panel
  key with deterministic last-row selection while recording duplicate counters.
  Existing data may continue to support diagnostic output, but it cannot become
  decision-usable or current merely because a file was rewritten today.
  External indicator panels retain the publisher authority (ECB, OFR, NY Fed,
  CFTC, FINRA, NYU V-Lab) instead of emitting a generic external_public source.
  yfinance remains a continuity route only; its route policy is diagnostic-only
  until a Tiingo/Massive observed-window parity report is explicitly reviewed.
authority_boundary:
  runtime_judgment_change: false
  research_verdict_change: false
  promotion_change: false
  ci_enforcement_change: false
  contract_enum_change: true
preregistered_expectation: >
  No provider retrieval is labelled decision-usable without causal availability
  evidence; incomplete OFR/NFCI/CISS-style component baskets cannot silently
  renormalize; duplicate ETF keys cannot reach paper sizing; and every staged
  release records provider outcome, availability, source convention, and
  integrity evidence.
observation_window: >
  Fourteen consecutive default launchd runs after deployment, including at
  least one provider failure, one fallback/carry-forward, one cache-expiry or
  stale release, one schema-drift/parity fixture, and one recovery run. The
  window is evidence collection only; it cannot be marked complete from tests
  or a single successful run.
rollback: >
  Revert this decision and the associated commit. Restore the previous
  observation/provenance schema readers only after confirming no release still
  depends on the new availability or integrity fields. Do not restore the old
  silent-renormalization, duplicate-key, or stale-as-fresh behavior in a live
  decision path.
acceptance:
  - Harvester package suite is green with the data-reliability contract tests.
  - Provider release tests reject unconfigured calendars and missing available_at.
  - Public residual component coverage is fail-closed unless research_only is explicit.
  - Cross-asset and paper-portfolio boundaries produce unique daily keys/scalars.
  - Canonical observations carry availability clocks and source provenance.
  - "configs/source_registry.yaml validates SourceSpec/SourceRoute semantics."
  - Tiingo/Massive parity remains shadow-only until the configured overlap window and human review certify the equivalent fallback.
  - External indicator output uses real publisher authority IDs.
  - "Cross-asset staging writes a DATA_CONTRACT_VIOLATION-backed structural report."
  - Dagster exposes blocking structural and non-blocking route-shadow checks.
  - The 14-day default-path evidence window remains explicitly pending until observed.
non_goals:
  - Configure provider publication calendars without approved source evidence.
  - Treat diagnostic or stale data as an authoritative current release.
  - Replace the orchestration platform, add distributed infrastructure, or alter research thresholds.
  - Claim that CI and unit tests substitute for the scheduled evidence window.
evidence:
  tests:
    - packages/harvester/tests/test_data_reliability_contract.py
    - tests/test_canonical_availability_contract.py
    - tests/test_paper_portfolio_data_shape.py
    - packages/orchestration/tests/test_provider_release.py
  implementation:
    - packages/harvester/src/harvester/core/availability.py
    - packages/harvester/src/harvester/core/source_drift.py
    - packages/harvester/src/harvester/core/source_spec.py
    - packages/harvester/src/harvester/core/etf_parity.py
    - packages/harvester/src/harvester/cross_asset_panel.py
    - packages/harvester/src/harvester/quality/data_contract.py
    - packages/orchestration/orchestration/assets/data_quality.py
    - scripts/verify_data_reliability_window.py
    - scripts/public_residual_stress.py
