schema_version: governance_decay.v1
updated_at: "2026-06-18"
purpose: >
  Structural forgetting policy. Generated registries and graph drift are
  recomputed each run — this file defines when human cleanup is required.

cadence: monthly

auto_actions:
  - id: archive_expired_submissions
    source: governance/experimental_submission_registry.yaml
    when: retire_after_past
  - id: rebuild_authority_graph
    source: scripts/build_authority_graph.py
    when: each_governance_status_run
  - id: rebuild_entrypoint_overlay
    source: scripts/build_entrypoint_registry.py
    when: weekly

human_review_triggers:
  - id: authority_graph_drift
    when: drift_count_gt
    threshold: 0
    action: align pipeline declarations with graph or update policy exemptions
  - id: missing_hand_registry
    when: missing_from_hand_registry_gt
    threshold: 10
    action: archive scripts or add to entrypoint_registry.yaml
  - id: topology_change_queue
    when: topology_review_count_gt
    threshold: 0
    action: review proposed authority graph edge changes

work_support_budget:
  max_files: 16
  one_in_one_out: true
  allowed_hand_edits:
    - authority_graph_policy.yaml
    - incentive_policy.yaml
    - experimental_submission_registry.yaml
    - deferred_work_register.yaml
