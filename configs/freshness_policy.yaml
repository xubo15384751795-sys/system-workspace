schema_version: workbench.freshness_policy.v1
description: >
  Batch/vintage data recency policy. This system is not real-time; freshness
  is evaluated against frozen evidence releases and model run timestamps.

default_timezone: UTC

frequency_thresholds:
  daily:
    fresh_lag_days: 3
    acceptable_lag_days: 10
  weekly:
    fresh_lag_days: 10
    acceptable_lag_days: 21
  monthly:
    fresh_lag_days: 45
    acceptable_lag_days: 75
  quarterly:
    fresh_lag_days: 120
    acceptable_lag_days: 180
  unknown:
    fresh_lag_days: 10
    acceptable_lag_days: 30

gate_defaults:
  stale_required_severity: warn
  missing_required_severity: warn
  retired_used_severity: block

# Evidence release TTL — see governance/architecture_reality_decisions.md §3-4
# Protocols: protocols/evidence_release.schema.json
evidence_release:
  default_ttl_days: 3
  force_refresh_after_days: 3
  core_judgment_on_expired: blocked
  research_on_expired: allowed_with_stale_warning
  training_feedback_on_expired: allowed_if_marked_stale
  user_override_allowed: true

# Sources that cannot be acquired from this host for environmental reasons
# (network blocks, licence walls) rather than because a producer is broken.
#
# A declared source stops contributing *admission blockers* — the consumer is
# allowed to run — but its absence is NOT hidden: the admission decision
# records it under `degradations`, and the downstream fail-closed paths still
# fire (paper_portfolio holds position and books the day HOLD_DEGRADED
# because P_public stays NaN). Declaring a source here never makes coverage
# look complete; it only stops one unreachable feed from halting the whole
# pipeline indefinitely.
#
# SCOPE — READ BEFORE RELYING ON THIS BLOCK:
#
#   This block applies ONLY to the daily pipeline's pre-consumption admission
#   gate on the operator (authoring) host. It is NOT a freshness claim and it
#   satisfies NO validation-roadmap success criterion.
#
#   In particular it does NOT satisfy P0-4 criterion 1 ("the Harvester release
#   is finalized and OFR FSI/CISS are fresh or within their governed
#   publication lag"). docs/history/P0_4_COMPUTE_DEVICE_HANDOFF.md §3 is explicit: if OFR
#   FSI or CISS is unavailable, failed, empty, or older than its governed
#   content clock, STOP — a finalized release alone is not freshness evidence.
#   P0-4 must be run on the compute device against real, freshly acquired
#   data. A declared entry here must never be read as that evidence.
#
# Remove any entry the moment the source becomes reachable again.
# Cleared 2026-08-03: OFR CSV at /financial-stress-index/data/fsi.csv is
# reachable again; publisher_url was corrected off the HTML landing page.
environmentally_blocked: {}

indicators:
  # Public stress components (OFR/NFCI/CISS) feed P_public in the paper
  # portfolio sizing path. A stale/missing component must be a hard blocker,
  # not a warn: without this the eq-weight PIT mean silently renormalizes
  # over the surviving subset (the 2026-05..07 NFCI-only degradation).
  NFCI:
    required: true
    frequency: weekly
    stale_required_severity: block
    missing_required_severity: block
  OFR_FSI:
    required: true
    frequency: daily
    calendar: XNYS
    stale_required_severity: block
    missing_required_severity: block
  CISS:
    required: true
    frequency: daily
    calendar: XNYS
    stale_required_severity: block
    missing_required_severity: block
    missing_reason: "ECB CISS; acquired via harvester external_indicators provider."
  VIXCLS:
    required: true
    frequency: daily
    stale_required_severity: warn
  BAMLH0A0HYM2:
    required: true
    frequency: daily
    stale_required_severity: warn
  MOVE:
    required: true
    frequency: daily
    missing_required_severity: warn
    missing_reason: "Not present in the admitted Harvester evidence release."
  TEDRATE:
    required: false
    frequency: daily
    status_override: retired_or_unavailable
    retired_reason: "FRED TEDRATE observations ended in January 2022 and must not be used for current diagnostics."
    retired_effective_date: "2022-01-21"
    current_diagnostics_allowed: false
  STLFSI4:
    required: false
    frequency: weekly
