task_id: phase-4-paths-canonicalization
status: ACCEPTED
cynefin_domain: complicated
decision: >
  Canonicalize the harvester exports root through system_runtime.paths.
  WorkspacePaths.harvester_exports returns Data/harvester/exports (the live
  latest symlink target). harvester.core.exporter.default_exports_root
  prefers WorkspacePaths over the legacy parents[3]/data/exports, with a
  fallback for standalone testability. repo_layout_map.md §8 records the
  Data/harvester/exports vs packages/harvester/data alias. Additionally,
  _replay_registry.load_official_panel now verifies release finalization
  before reading (Phase 4.2), closing the stale-data-into-positions P0 class
  at the read-time boundary.
supersedes: []
