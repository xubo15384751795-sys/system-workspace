# Entrypoint Registry — Script status and ownership
# Created: 2026-06-16
# See: governance/capability_registry.yaml
#
# Status enum:
#   active             — 当前使用，有真实数据流
#   compatibility_wrapper — root thin wrapper，真实实现在 owner module
#   shadow_active      — 只产出诊断/记录，不能执行权威动作
#   experimental       — 一次性实验，不进入主路径
#   deprecated         — 已弃用，等待清理
#   archive_candidate  — 应移入 scripts/archive/

# === ACTIVE ENTRPOINTS ===

daily_run:
  script: scripts/daily_run.py
  status: active
  owner: Deformation Framework
  description: Daily pipeline entry point
  allowed_use:
    - daily_deformation_run
    - current_output_generation

