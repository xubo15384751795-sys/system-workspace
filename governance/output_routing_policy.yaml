schema_version: output_routing.v1
created: "2026-06-17"
purpose: >
  Automatic routing, lifecycle, and archival of Output artifacts.
  Every output must have a display_group, lifecycle status, and TTL.

groups:
  current:
    path: Output/current/
    description: "Authority user entry points only"
    can_affect_user_readout: true
    allowed_artifacts:
      - 00_READ_ME_FIRST.md
      - framework_output.json
      - neutral_pressure_snapshot.json
      - status.json
      - NEXT_ACTIONS.md
      - artifact_navigator.md
      - artifact_navigator.json
      - benchmark_evidence_dashboard.md
      - benchmark_evidence_dashboard.html
      - latest_run_id.txt
      - latest_summary.md
      - quality_validation.json
      - model_run.json
      - model_run_macro_pressure_measurement.json
      - workbench_framework_output_macro_pressure_measurement.json
      - decision_trace.json
      - work_brief.md
      - work_brief.json
      - signal_card.md
      - signal_card.json
      - signal_consensus.md
      - signal_consensus.json
      - data_gaps.md
      - data_gaps.json
      - change_analysis.md
      - change_analysis.json
      - evidence_grade_report.json
      - artifact_registry.json
      - measurement_quality.json
      - operator_activations.json  # mechanism operator readout; does not affect core judgment

  runs:
    path: Output/archive/legacy_2026H1/deformation_runs/
    description: "Archived Deformation v1 run packages; evidence only"
    can_affect_core_judgment: false
    lifecycle: archived_falsified

  neutral_pressure_runs:
    path: Output/runs/
    description: "Run-local daily pipeline bundles"
    can_affect_core_judgment: true

  generations:
    path: Output/generations/
    description: "Immutable published generations; Output/live points here with a relative symlink"
    can_affect_core_judgment: true

  state:
    path: Output/state/
    description: "Cross-run mutable state (alerts, caselab, health, sandbox, validation, …)"
    can_affect_core_judgment: false

  research:
    path: Output/research/
    description: "Backtest, ML, K/X/NLP experiments"
    can_affect_core_judgment: false
    default_ttl_days: 30

  governance:
    path: Output/system_learning/
    description: "Audit, learning, feedback"
    can_affect_core_judgment: false

  ml_validation:
    path: Output/state/validation/
    description: "Walk-forward, baseline comparison, as-of integrity — review-only diagnostics"
    can_affect_core_judgment: false
    allowed_use: validation_only
    lifecycle: active
    owner: ML Signals

  sandbox:
    path: Output/state/sandbox/
    description: "Temporary experiments"
    can_affect_core_judgment: false
    default_ttl_days: 7

  benchmarks:
    path: Output/state/benchmarks/
    description: "Qlib/market-feedback isolation trees"
    can_affect_core_judgment: false

  archive:
    path: Output/archive/
    description: "Frozen history"
    can_affect_core_judgment: false

  legacy_proxy_pipeline:
    path: "Output/archive/legacy_2026H1/{benchmark_comparison,calibration,d_proxy_daily,m_proxy_daily,m_proxy_optimized,market_state_classifier,proxy_validation,solution,walk_forward_validation}/"
    description: "Legacy proxy pipeline outputs — produced by archived scripts only"
    can_affect_core_judgment: false
    lifecycle: archived
    owner: ML Signals
    default_ttl_days: 90
    note: "Moved 2026-09-09 into archive/legacy_2026H1."

  legacy_reports:
    path: Output/archive/legacy_2026H1/reports/
    description: "Legacy morphology reports"
    can_affect_core_judgment: false
    lifecycle: archived
    owner: ML Signals
    default_ttl_days: 90
    note: "Moved 2026-09-09 into archive/legacy_2026H1."

  legacy_evaluation:
    path: Output/archive/legacy_2026H1/workbench/evaluation/
    description: "Legacy replay evaluation data"
    can_affect_core_judgment: false
    lifecycle: archived
    owner: Workbench
    default_ttl_days: 90
    note: "Moved 2026-09-09 into archive/legacy_2026H1."

  legacy_2026H1:
    path: Output/archive/legacy_2026H1/
    description: "Frozen Output directories with mtime on or before 2026-06-20"
    can_affect_core_judgment: false
    lifecycle: archived

lifecycle_statuses:
  draft:
    description: "Being generated, not yet complete"
    can_be_consumed: false

  candidate:
    description: "Complete but not yet validated"
    can_be_consumed: true
    can_affect_core_judgment: false

  current:
    description: "Active authority artifact"
    can_be_consumed: true
    can_affect_core_judgment: true

  research_only:
    description: "Research/training only"
    can_be_consumed: true
    can_affect_core_judgment: false

  superseded:
    description: "Replaced by newer version"
    can_be_consumed: false
    archive_after_days: 7

  archived:
    description: "Frozen, kept for traceability"
    can_be_consumed: false

  retired:
    description: "No longer relevant"
    can_be_consumed: false

rules:
  - "Output/current/ must only contain artifacts listed in groups.current.allowed_artifacts"
  - "sandbox artifacts older than ttl_days must be moved to archive"
  - "research artifacts with no consumers for 30 days become archive_candidate"
  - "unregistered Output directories require owner and lifecycle status"
  - "legacy display symlinks must not exist in Output/current/"
  - "Output/live must be a relative symlink into Output/generations/"
  - "compatibility symlinks current, judgment, position, quality, ledgers, trade_decision, trade_ledger, system_learning remain at Output/"

root_entries:
  - archive
  - current
  - generations
  - judgment
  - ledgers
  - live
  - logs
  - position
  - quality
  - runs
  - state
  - system_learning
  - trade_decision
  - trade_ledger
