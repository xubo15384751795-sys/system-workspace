# Series Registry — Canonical definition of every series eligible for Harvester acquisition.
# This is the single source of truth for provider routing, structural role annotation,
# and release requirements.  The Harvester records structural_role but does NOT decide
# how a series enters Deformation equations (channels, preset membership, etc.).

schema_version: "1.0"

providers:
  fred:
    source_id: fred
    kind: public_api
    url: https://api.stlouisfed.org/fred/series/observations
    rate_limit_seconds: 0.25
  h41:
    source_id: h41
    kind: public_file
    url: https://www.federalreserve.gov/datadownload/Download.aspx
    note: "Direct Federal Reserve Data Download Program CSV. FRED bridge remains a fallback when configured."
  treasury:
    source_id: treasury
    kind: public_api
    url: https://api.fiscaldata.treasury.gov
  sec:
    source_id: sec
    kind: public_api
    url: https://data.sec.gov/submissions
    rate_limit_seconds: 0.5
  openbb_fred:
    source_id: fred          # emitted source_id is fred, not openbb
    kind: public_api
    url: openbb:economy.fred_series
    note: "OpenBB is the acquisition engine; downstream identity remains provider-native."
  openbb_tiingo:
    source_id: tiingo
    kind: public_api
    url: openbb:equity.price.historical
    note: "OpenBB/Tiingo EOD ETF OHLCV. Free API key; downstream identity remains tiingo."
  openbb_yfinance:
    source_id: yfinance
    kind: public_api
    url: openbb:equity.price.historical
    note: "OpenBB/yfinance EOD ETF OHLCV. No API key required; fallback for tiingo."
  etf_provider_chain:
    source_id: etf_provider_chain
    kind: public_api
    url: provider-chain:tiingo,massive,yfinance
    note: "Cross-asset ETF EOD chain. Source selected per ticker and recorded in the release manifest."
  direct_ofr:
    source_id: ofr
    kind: public_file
    url: https://www.financialresearch.gov/financial-stress-index/
    note: "Direct CSV download from OFR website."
  external_public:
    source_id: external_public
    kind: public_api
    url: https://publicreporting.cftc.gov/
    note: "Batch-2 public leverage feeds via harvester.providers.external_indicators (CFTC/NY Fed/FINRA)."
  cboe_direct:
    source_id: cboe
    kind: public_file
    url: https://cdn.cboe.com/api/global/us_indices/daily_prices/
    intraday_url_template: https://cdn.cboe.com/api/global/delayed_quotes/quotes/_{symbol}.json
    note: "Direct CBOE. CSV=EOD, JSON=15-minute delayed intraday. No API key."
  derived:
    source_id: derived
    kind: computed
    note: "Computed series built inside Harvester from other acquired inputs."

series:
  # -------------------------------------------------------------------
  # Required — core structural series
  # -------------------------------------------------------------------
  NFCI:
    canonical_id: NFCI
    provider_priority:
      - fred_chicago_fed   # canonical source
      - fred
      - openbb_fred
    measurement_block: financial_conditions
    structural_role: credit_liquidity_condition
    frequency: weekly
    unit: index
    required_for_release: true
    required_for_model_input: true
    quality_expectation: observed
    description: "Chicago Fed National Financial Conditions Index"

  VIXCLS:
    canonical_id: VIXCLS
    provider_priority:
      - fred
      - cboe_direct
      - openbb_fred
    measurement_block: equity_volatility
    structural_role: volatility_anchor
    frequency: daily
    unit: index
    required_for_release: true
    required_for_model_input: true
    quality_expectation: observed
    description: "CBOE Volatility Index: VIX"

  BAMLH0A0HYM2:
    canonical_id: BAMLH0A0HYM2
    provider_priority:
      - fred
      - openbb_fred
    measurement_block: credit_spread
    structural_role: credit_depth_proxy
    frequency: daily
    unit: percent
    required_for_release: true
    required_for_model_input: true
    quality_expectation: observed
    description: "ICE BofA US High Yield Index Option-Adjusted Spread"

  # -------------------------------------------------------------------
  # Missing required series (Phase C.4)
  # -------------------------------------------------------------------
  MOVE:
    canonical_id: MOVE
    provider_priority:
      - cboe_direct
      - synthetic_rates_vol_proxy
    measurement_block: rates_volatility
    structural_role: rates_volatility_index
    frequency: daily
    unit: index
    required_for_release: true
    required_for_model_input: true
    quality_expectation: observed
    allow_synthetic_proxy: true
    synthetic_proxy_id: MOVE_PROXY
    description: "Rates volatility slot now backed by current CBOE VXTLT direct CSV. Proxy allowed if real unavailable."

  TYVIX:
    canonical_id: TYVIX
    provider_priority:
      - cboe_direct
    measurement_block: rates_volatility
    structural_role: rates_vol_transition
    frequency: daily
    unit: index
    required_for_release: true
    required_for_model_input: false
    quality_expectation: observed
    description: "CBOE/ICE Interest Rate Volatility Index. Historical public rates-volatility series; CBOE direct file currently ends in 2023."

  VXTLT:
    canonical_id: VXTLT
    provider_priority:
      - cboe_direct
    measurement_block: rates_volatility
    structural_role: rates_vol_transition
    frequency: daily
    unit: index
    required_for_release: true
    required_for_model_input: true
    quality_expectation: observed
    description: "Cboe 20+ Year Treasury Bond ETF Volatility Index. Current public MOVE alternative."

  VVIX:
    canonical_id: VVIX
    provider_priority:
      - cboe_direct
    measurement_block: volatility_surface
    structural_role: vol_of_vol_transition
    frequency: daily
    unit: index
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "CBOE VIX Volatility Index."

  SKEW:
    canonical_id: SKEW
    provider_priority:
      - cboe_direct
    measurement_block: volatility_surface
    structural_role: tail_skew_transition
    frequency: daily
    unit: index
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "CBOE SKEW Index."

  VIX9D:
    canonical_id: VIX9D
    provider_priority:
      - cboe_direct
    measurement_block: volatility_term_structure
    structural_role: short_horizon_vol_transition
    frequency: daily
    unit: index
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "CBOE 9-Day Volatility Index."

  VIX3M:
    canonical_id: VIX3M
    provider_priority:
      - cboe_direct
    measurement_block: volatility_term_structure
    structural_role: three_month_vol_transition
    frequency: daily
    unit: index
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "CBOE 3-Month Volatility Index."

  VIX6M:
    canonical_id: VIX6M
    provider_priority:
      - cboe_direct
    measurement_block: volatility_term_structure
    structural_role: six_month_vol_transition
    frequency: daily
    unit: index
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "CBOE 6-Month Volatility Index."

  SPX:
    canonical_id: SPX
    provider_priority:
      - cboe_direct
    measurement_block: market_depth
    structural_role: roll_bid_ask_input
    frequency: daily
    unit: index
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "CBOE S&P 500 Index close, used for Roll bid-ask spread approximation."

  STLFSI4:
    canonical_id: STLFSI4
    provider_priority:
      - fred
      - openbb_fred
    measurement_block: financial_stress
    structural_role: financial_stress_index
    frequency: weekly
    unit: index
    required_for_release: true
    required_for_model_input: false
    quality_expectation: observed
    description: "St. Louis Fed Financial Stress Index"

  OFR_FSI:
    canonical_id: OFR_FSI
    provider_priority:
      - direct_ofr
      - openbb_if_available
    measurement_block: systemic_stress
    structural_role: systemic_stress_index
    frequency: daily
    unit: index
    required_for_release: false  # degraded: OFR requires manual CSV download; STLFSI covers financial_stress block
    required_for_model_input: false
    quality_expectation: observed
    allow_synthetic_proxy: true
    synthetic_proxy_id: STLFSI  # fallback to St. Louis Fed stress index when OFR unavailable
    description: "OFR Financial Stress Index — systemic stress measurement (degraded, see STLFSI proxy)"

  # -------------------------------------------------------------------
  # Batch-2 leverage / positioning (X_agg feeds) — free public sources
  # Acquired via harvester.providers.external_indicators KNOWN_INDICATORS.
  # -------------------------------------------------------------------
  CFTC_TFF_LEV_SP:
    canonical_id: CFTC_TFF_LEV_SP
    provider_priority: [external_public]
    measurement_block: shadow_leverage
    structural_role: leveraged_fund_equity_net_position
    frequency: weekly
    unit: contracts
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "CFTC TFF Leveraged Funds net position in E-mini S&P 500 (weekly)."

  NYFED_PD_TREASURY_NET:
    canonical_id: NYFED_PD_TREASURY_NET
    provider_priority: [external_public]
    measurement_block: shadow_leverage
    structural_role: primary_dealer_treasury_net_position
    frequency: weekly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "NY Fed Primary Dealer net Treasury positions excl. TIPS (PDPOSGST-TOT, weekly)."

  NYFED_PD_TREASURY_LE2Y:
    canonical_id: NYFED_PD_TREASURY_LE2Y
    provider_priority: [external_public]
    measurement_block: shadow_leverage
    structural_role: primary_dealer_treasury_le2y
    frequency: weekly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "NY Fed PD Treasury coupons due ≤2y (PDPOSGSC-L2). Partial maturity bucket for T1."

  NYFED_PD_TREASURY_GT11Y:
    canonical_id: NYFED_PD_TREASURY_GT11Y
    provider_priority: [external_public]
    measurement_block: shadow_leverage
    structural_role: primary_dealer_treasury_gt11y
    frequency: weekly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "NY Fed PD Treasury coupons due >11y (PDPOSGSC-G11). Partial maturity bucket for T1."

  FINRA_MARGIN_DEBT:
    canonical_id: FINRA_MARGIN_DEBT
    provider_priority: [external_public]
    measurement_block: shadow_leverage
    structural_role: retail_margin_debt
    frequency: monthly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    allow_synthetic_proxy: true
    synthetic_proxy_id: BOGZ1FL663067003Q
    description: "FINRA customer margin debit balances (monthly). Z.1 BOGZ1FL663067003Q is quarterly proxy."

  # -------------------------------------------------------------------
  # M channel — funding / transmission
  # -------------------------------------------------------------------
  T10Y2Y:
    canonical_id: T10Y2Y
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_gap
    structural_role: curve_shape_proxy
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "10-Year Treasury Constant Maturity Minus 2-Year"

  DFF:
    canonical_id: DFF
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_gap
    structural_role: policy_rate_anchor
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "Federal Funds Effective Rate"

  # -------------------------------------------------------------------
  # D channel — depth / credit conditions
  # -------------------------------------------------------------------
  HYG:
    canonical_id: HYG
    provider_priority: [etf_provider_chain]
    measurement_block: depth
    structural_role: high_yield_etf_price
    frequency: daily
    unit: usd
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "iShares iBoxx High Yield Corporate Bond ETF daily close via the owned Tiingo/Massive/yfinance chain."

  LQD:
    canonical_id: LQD
    provider_priority: [etf_provider_chain]
    measurement_block: depth
    structural_role: investment_grade_etf_price
    frequency: daily
    unit: usd
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "iShares iBoxx Investment Grade Corporate Bond ETF daily close via the owned Tiingo/Massive/yfinance chain."

  TLT:
    canonical_id: TLT
    provider_priority: [etf_provider_chain]
    measurement_block: depth
    structural_role: treasury_duration_etf_price
    frequency: daily
    unit: usd
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "iShares 20+ Year Treasury Bond ETF daily close via the owned Tiingo/Massive/yfinance chain."

  SOFR:
    canonical_id: SOFR
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_access
    structural_role: secured_rate_benchmark
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "Secured Overnight Financing Rate"

  IORB:
    canonical_id: IORB
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_access
    structural_role: reserve_rate_benchmark
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "Interest Rate on Reserve Balances"

  DCPF3M:
    canonical_id: DCPF3M
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_access
    structural_role: commercial_paper_rate
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "3-Month AA Financial Commercial Paper Rate"

  DGS3MO:
    canonical_id: DGS3MO
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_access
    structural_role: treasury_bill_rate
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "3-Month Treasury Constant Maturity Rate"

  DPRIME:
    canonical_id: DPRIME
    provider_priority: [fred, openbb_fred]
    measurement_block: funding_access
    structural_role: prime_rate
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Bank Prime Loan Rate"

  BAMLC0A0CM:
    canonical_id: BAMLC0A0CM
    provider_priority: [fred, openbb_fred]
    measurement_block: depth
    structural_role: investment_grade_spread
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "ICE BofA US Corporate Index Option-Adjusted Spread"

  BAMLC0A4CBBB:
    canonical_id: BAMLC0A4CBBB
    provider_priority: [fred, openbb_fred]
    measurement_block: depth
    structural_role: bbb_spread
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "ICE BofA BBB US Corporate Index Option-Adjusted Spread"

  DBAA:
    canonical_id: DBAA
    provider_priority: [fred, openbb_fred]
    measurement_block: depth
    structural_role: baa_yield
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Moody's Seasoned Baa Corporate Bond Yield"

  DAAA:
    canonical_id: DAAA
    provider_priority: [fred, openbb_fred]
    measurement_block: depth
    structural_role: aaa_yield
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Moody's Seasoned Aaa Corporate Bond Yield"

  BAA10YM:
    canonical_id: BAA10YM
    provider_priority: [fred, openbb_fred]
    measurement_block: depth
    structural_role: baa_10y_spread
    frequency: monthly
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Moody's Baa Corporate Bond Yield Relative to 10-Year Treasury"

  # -------------------------------------------------------------------
  # NFCI sub-indices
  # -------------------------------------------------------------------
  NFCIRISK:
    canonical_id: NFCIRISK
    provider_priority: [fred, openbb_fred]
    measurement_block: financial_conditions
    structural_role: nfci_risk_subindex
    frequency: weekly
    unit: index
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Chicago Fed NFCI Risk Subindex"

  NFCICREDIT:
    canonical_id: NFCICREDIT
    provider_priority: [fred, openbb_fred]
    measurement_block: financial_conditions
    structural_role: nfci_credit_subindex
    frequency: weekly
    unit: index
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Chicago Fed NFCI Credit Subindex"

  NFCILEVERAGE:
    canonical_id: NFCILEVERAGE
    provider_priority: [fred, openbb_fred]
    measurement_block: financial_conditions
    structural_role: nfci_leverage_subindex
    frequency: weekly
    unit: index
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Chicago Fed NFCI Leverage Subindex"

  # -------------------------------------------------------------------
  # H.4.1 fields (direct Federal Reserve DDP CSV; FRED fallback available)
  # -------------------------------------------------------------------
  discount_window:
    canonical_id: discount_window
    provider_priority: [h41]
    measurement_block: shadow_funding
    structural_role: discount_window_borrowing
    frequency: weekly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed_nonzero
    description: "Discount Window Borrowing (direct H.4.1 DDP CSV)"

  primary_credit:
    canonical_id: primary_credit
    provider_priority: [h41]
    measurement_block: shadow_funding
    structural_role: primary_credit_usage
    frequency: weekly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed_nonzero
    description: "Primary Credit (direct H.4.1 DDP CSV)"

  btfp:
    canonical_id: btfp
    provider_priority: [h41]
    measurement_block: shadow_funding
    structural_role: btfp_usage
    frequency: weekly
    unit: mil_usd
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed_zero_post_expiry
    description: "Bank Term Funding Program (direct H.4.1 DDP CSV; observed_zero post-expiry)"

  # -------------------------------------------------------------------
  # Treasury
  # -------------------------------------------------------------------
  tot_pub_debt_out_amt:
    canonical_id: tot_pub_debt_out_amt
    source_series_id: debt_to_penny:tot_pub_debt_out_amt
    provider_priority: [treasury]
    measurement_block: refinancing_pressure
    structural_role: public_debt_level
    frequency: daily
    unit: usd
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "Total Public Debt Outstanding"

  open_today_bal:
    canonical_id: open_today_bal
    source_series_id: daily_treasury_statement:open_today_bal
    provider_priority: [treasury]
    measurement_block: liquidation_path_instability
    structural_role: treasury_cash_balance
    frequency: daily
    unit: usd
    required_for_release: false
    required_for_model_input: true
    quality_expectation: observed
    description: "Opening Balance Today (Daily Treasury Statement)"

  # -------------------------------------------------------------------
  # SEC filing pulse
  # -------------------------------------------------------------------
  SEC_FILING_PULSE:
    canonical_id: SEC_FILING_PULSE
    # Provider-native id for the SEC submissions endpoint is a CIK, not the
    # canonical_id. Without this, registry routing would pass the literal
    # "SEC_FILING_PULSE" to SecProvider, which treats any non-OBS id as a CIK
    # and builds an invalid CIK000SEC_FILING_PULSE.json URL (404). Pin to the
    # same CIK the legacy OFFICIAL_SERIES_MAP uses for the issuer filing pulse.
    source_series_id: "0000072971"
    provider_priority: [sec]
    measurement_block: verifiability
    structural_role: issuer_filing_pulse
    frequency: daily
    unit: filing_count
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Issuer filing pulse — daily EDGAR filing count. Coarse proxy, NOT credit-stress metric."

  # X_agg v1 off-balance-sheet — Phase 1 interim (see
  # ../governance/x_agg_v1_obs_procurement_plan.md). Aggregate derivatives
  # notional / total assets over the large dealer-bank basket, from SEC XBRL
  # companyconcept. Interim/coarse; canonical source is FFIEC FR Y-9C HC-L.
  OBS_DERIV_TO_ASSETS:
    canonical_id: OBS_DERIV_TO_ASSETS
    source_series_id: OBS_DERIV_TO_ASSETS
    provider_priority: [sec]
    measurement_block: off_balance_sheet
    structural_role: obs_to_assets
    frequency: quarterly
    unit: ratio
    required_for_release: false
    required_for_model_input: false
    quality_expectation: observed
    description: "Aggregate derivatives notional / total assets, large dealer banks (SEC XBRL). Phase 1 interim OBS proxy for X_agg v1."

  # -------------------------------------------------------------------
  # TEDRATE replacement (derived)
  # -------------------------------------------------------------------
  SOFR_IORB_SPREAD:
    canonical_id: SOFR_IORB_SPREAD
    provider_priority: [derived]
    derived: true
    formula: "SOFR - IORB"
    inputs: [SOFR, IORB]
    measurement_block: funding_gap
    structural_role: tedrate_replacement_primary
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: derived
    description: "SOFR-IORB spread — primary TEDRATE replacement. Aligned via inner join."

  CP_TBILL_SPREAD:
    canonical_id: CP_TBILL_SPREAD
    provider_priority: [derived]
    derived: true
    formula: "DCPF3M - DGS3MO"
    inputs: [DCPF3M, DGS3MO]
    measurement_block: funding_gap
    structural_role: tedrate_replacement_secondary
    frequency: daily
    unit: percent
    required_for_release: false
    required_for_model_input: false
    quality_expectation: derived
    description: "CP-TBill spread — secondary TEDRATE replacement. Aligned via inner join."

  VIX3M_VIX_SLOPE:
    canonical_id: VIX3M_VIX_SLOPE
    provider_priority: [derived]
    derived: true
    formula: "VIX3M - VIXCLS"
    inputs: [VIX3M, VIXCLS]
    measurement_block: volatility_term_structure
    structural_role: vix_term_slope_transition
    frequency: daily
    unit: index_points
    required_for_release: false
    required_for_model_input: true
    quality_expectation: derived
    description: "VIX term-structure slope using CBOE VIX3M minus FRED/CBOE VIX."

  VIX9D_VIX_RATIO:
    canonical_id: VIX9D_VIX_RATIO
    provider_priority: [derived]
    derived: true
    formula: "VIX9D / VIXCLS"
    inputs: [VIX9D, VIXCLS]
    measurement_block: volatility_term_structure
    structural_role: vix_short_end_ratio
    frequency: daily
    unit: ratio
    required_for_release: false
    required_for_model_input: false
    quality_expectation: derived
    description: "VIX9D over spot VIX — very short-end vol term structure."

  SPX_ROLL_SPREAD:
    canonical_id: SPX_ROLL_SPREAD
    provider_priority: [derived]
    derived: true
    formula: "ROLL(SPX,21)"
    inputs: [SPX]
    measurement_block: market_depth
    structural_role: roll_bid_ask_spread
    frequency: daily
    unit: return_units
    required_for_release: false
    required_for_model_input: true
    quality_expectation: derived
    description: "Roll bid-ask spread approximation from CBOE SPX daily closes."

  MOVE_PROXY:
    canonical_id: MOVE_PROXY
    provider_priority: [derived]
    derived: true
    synthetic_proxy: true
    formula: "VIXCLS * 0.5"
    inputs: [VIXCLS]
    measurement_block: rates_volatility
    structural_role: rates_volatility_synthetic_proxy
    frequency: daily
    unit: index
    required_for_release: false
