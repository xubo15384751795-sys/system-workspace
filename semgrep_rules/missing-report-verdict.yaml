rules:
  - id: missing-report-verdict
    patterns:
      - pattern: report_verdict = $VAL
      - pattern-not: report_verdict = "UNKNOWN"
      - pattern-not: report_verdict = None
      - pattern-not: report_verdict = validate_report_verdict(...)
      - pattern-not: report_verdict = $RESULT["verdict"]
    message: |
      Reports should pass through validate_report_verdict() (NNF#9).
    severity: INFO
    languages:
      - python
