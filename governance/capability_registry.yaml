schema_version: capability_registry.v1
updated_at: "2026-07-18"
purpose: >
  Module capability registry. Tracks status, allowed/forbidden claims, blockers,
  and promotion requirements. Producer/consumer details removed — see
  entrypoint_registry.yaml (scripts) and output_routing_policy.yaml (outputs).

