schema_version: data_request.v1
created: "2026-06-17"
purpose: >
  Modules request data from Harvester through this registry.
  Harvester aggregates, prioritizes, and responds.
  No module should permanently bypass Harvester with direct acquisition.

requests:
  - request_id: etf_cross_asset_panel
    requested_by: Workbench Signals
    needed_for: K cross-asset confirmation
    current_source: Data/panels/cross_asset_daily_panel.parquet
    current_authority: non_harvester_transitional
    status: sourcing
    priority: medium
    harvester_response: >
      openbb_yfinance now has SPY/QQQ/IWM/DIA in OFFICIAL_SERIES_MAP.
      ETF evidence release pending daily run integration.
    core_judgment_priority: low_until_harvester_release
    created: "2026-06-17"

  - request_id: merged_data_proxy_inputs
    requested_by: Deformation Framework
    needed_for: compute_proxies.py proxy signal computation
    current_source: Data/merged_data/benchmark_panel_with_etfs.parquet
    current_authority: migration_artifact
    status: transitional_import_required
    priority: medium
    harvester_response: pending
    core_judgment_priority: low_until_harvester_release
    created: "2026-06-17"

  - request_id: fred_cached_data
    requested_by: Deformation Framework
    needed_for: FRED series (TEDRATE, STLFSI4, etc.)
    current_source: Data/structural_lab/runtime/fred_cache/
    current_authority: legacy_runtime_cache
    status: available_via_harvester
    priority: low
    harvester_response: >
      FRED data available through Harvester official release (openbb_fred provider).
      fred_cache is legacy; consumers should migrate to Harvester evidence bundle.
    core_judgment_priority: low
    created: "2026-06-17"
