schema_version: deferred_work.v1
created: "2026-06-17"
purpose: >
  Highest-level register for work that cannot be completed short-term.
  Every deferred item has a maturity date, review cadence, and fallback plan.
  Referenced by: README.md, MODULES.md, system_constitution.yaml

# Dual clock: every item must declare both execution_window and evidence_window.
# See governance/system_constitution.yaml → dual_clock.
# execution_window: how long the code change takes (Agent-compressible, 1-3 days)
# evidence_window: how long validation needs real data/time (not compressible)

items:
  - id: pipeline_runner_import_migration
    title: "daily_run subprocess → module callable runner"
    owner: Workbench
    status: in_progress
    reason: >
      Callable runner landed in scripts/_pipeline_runner.py with --execution-mode callable.
      Pilot steps can migrate individually; subprocess remains default until evidence window closes.
    target_window: "2026-07-01 to 2026-07-31"
    execution_window: "1-3 days per step (import, test, verify)"
    evidence_window: "14 days (verify no subprocess breakage across pipeline runs)"
    review_date: "2026-07-01"
    hard_deadline: "2026-08-15"
    risk_if_ignored: >
      subprocess overhead remains; no runtime code reuse across modules.
    fallback_if_expired: >
      Keep subprocess mode indefinitely; metadata is already sufficient for governance.

  - id: duckdb_snapshot_store_migration
    title: "Migrate DuckDBSnapshotStore from structural_lab/runtime/ to Harvester-backed store"
    owner: Deformation Framework
    status: deferred
    reason: >
      DuckDBSnapshotStore (46MB) is actively used by runtime. Migration requires
      dual-write period to ensure snapshot query compatibility.
    strategy: dual_write_before_cutover
    execution_window: "2-3 days (implement dual-write, update consumers, remove old store)"
    evidence_window: "14 days (verify snapshot query compatibility across pipeline runs)"
    review_date: "2026-07-15"
    hard_deadline: "2026-07-31"
    risk_if_ignored: >
      46MB legacy runtime store remains canonical; cannot compress or archive.
    fallback_if_expired: >
      Keep DuckDB as-is; mark as legacy_runtime_store in data_retention_policy.

  - id: submodule_consolidation_plan
    title: "Consolidate 4 submodules into packages/ monorepo structure"
    owner: System
    status: deferred
    reason: >
      Requires packaging design, dependency resolution, and public reuse API.
      Current submodule structure works; consolidation is optimization, not fix.
    target_window: "30 to 45 days from 2026-06-17"
    execution_window: "3-5 days (move files, update imports, fix CI)"
    evidence_window: "30 days (verify cross-module imports, CI stability, no drift)"
    review_date: "2026-07-01"
    hard_deadline: "2026-07-31"
    risk_if_ignored: >
      Submodule dirty state, Python version inconsistency, pytest config scatter.
    fallback_if_expired: >
      Keep submodules; add cross-repo CI to catch drift.

  - id: merged_data_harvester_consolidation
    title: "Migrate Data/merged_data/ into Harvester evidence release"
    owner: Deformation Framework
    status: deferred
    reason: >
      Merged data was previously consumed by compute_proxies.py (now archived).
      Must register as transitional Harvester artifact, then migrate remaining consumers.
    strategy: "register → provenance → migrate consumer → archive"
    execution_window: "1-2 days (register artifact, update consumer imports)"
    evidence_window: "14 days (verify no data pipeline breakage after migration)"
    review_date: "2026-07-01"
    hard_deadline: "2026-07-15"
    risk_if_ignored: >
      Shadow data source persists outside Harvester governance.
    fallback_if_expired: >
      Mark as legacy_migrated; add data_authority_registry entry.

  - id: callable_e2e_pipeline_tests
    title: "Callable E2E pipeline tests — step.run(context) direct import"
    owner: Workbench
    status: in_progress
    blocked_by: pipeline_runner_import_migration
    reason: >
      Callable runner exists; tests/test_pipeline_runner.py covers pilot callable steps.
      Broader E2E expansion continues as steps flip execution.mode to callable.
    execution_window: "3-5 days (write callable tests for 11 pipeline steps)"
    evidence_window: "14 days (verify callable tests pass across CI runs)"
    trigger_condition: >
      Enable only when daily_run step execution supports future_callable /
      module runner mode.  At that point, add:
        tests/test_daily_pipeline_callable_e2e.py
      with step.run(context) for the main chain (11 steps).
    target_window: "2026-07-01 to 2026-07-31"
    review_date: "2026-07-01"
    hard_deadline: "2026-08-15"
    risk_if_ignored: >
      No import-level integration testing; subprocess smoke remains the ceiling.
    fallback_if_expired: >
      Keep subprocess smoke as the E2E ceiling; governance contract tests
      already cover the critical invariants.

  - id: root_scripts_pipeline_refactoring
    title: "Reduce root scripts to ≤35 by moving pipeline implementations to modules"
    owner: Workbench
    status: deferred
    reason: >
      24 pipeline implementations are called via subprocess from daily_run.py.
      Moving them to modules requires updating daily_run.py to import from modules.
      Current 44 scripts is structurally clean; 35 target requires pipeline refactoring.
    execution_window: "2-3 days per batch of scripts (move, update imports, test)"
    evidence_window: "14 days per batch (verify no pipeline breakage)"
    review_date: "2026-07-15"
    hard_deadline: "2026-08-15"
    risk_if_ignored: >
      Root scripts stays at 44; acceptable if structural role principle is maintained.
    fallback_if_expired: >
      Accept 44 as practical minimum; enforce structural role audit quarterly.

  - id: data_sources_retirement
    title: "Retire data_sources.py after adapter migration — 7/15 legacy deadline"
    owner: Deformation Framework
    status: completed_sealed
    reason: >
      data_sources.py (1378 lines), external_downloads.py (109 lines),
      and public_adapters.py (716 lines) moved to src/_legacy/data/ on 2026-06-29.
      src/data/__init__.py no longer exports legacy DataHub symbols.
      Internal imports updated.  Boundary tests updated.
      Step 3 (retire_or_seal) decided 2026-06-30: SEAL.
      _legacy/data/ retained as read-only with deprecation warnings.
      Gateway shim and adapters shim retained with retire_after markers.
      ALLOW_LEGACY_DATAHUB guards legacy access.
    seal_decision:
      date: "2026-06-30"
      option: seal
      rationale: >
        Lower risk than full retire. _legacy/data/ kept read-only.
        Gateway shim (src/data/gateway/__init__.py) and adapters shim
        (src/data/adapters/__init__.py) retained with deprecation warnings
        and retire_after: 2026-07-15. ALLOW_LEGACY_DATAHUB guards access.
        Full retire can be reconsidered after Phase 7 pipeline stabilization.
    execution_window: "3-5 days (freeze, move, update imports, verify)"
    evidence_window: "14 days (verify no pipeline breakage after legacy removal)"
    migration_steps:
      - step: freeze
        description: >
          Active pipeline must not import. Add ALLOW_LEGACY_DATAHUB=1 guard.
          Only dual_path_compare, legacy replay, migration validation may use.
        target_date: "2026-06-24"
        completed: "2026-06-18"
      - step: move
        description: >
          Moved to src/_legacy/data/. Public import no longer exposes legacy symbols.
          src/data/__init__.py stops exporting legacy symbols.
        target_date: "2026-07-01"
        completed: "2026-06-29"
      - step: retire_or_seal
        description: >
          7/15 decision made 2026-06-30: SEAL.
          _legacy/data/ retained read-only. Gateway/adapters shims with deprecation.
          ALLOW_LEGACY_DATAHUB guards legacy access.
        target_date: "2026-07-15"
        completed: "2026-06-30"
    progress:
      - "2026-06-18: FREEZE — ALLOW_LEGACY_DATAHUB=1 guard active in freeze.py + assembly.py"
      - "2026-06-29: MOVE — data_sources.py, external_downloads.py, public_adapters.py → src/_legacy/data/"
      - "2026-06-29: src/data/__init__.py — legacy DataHub symbols removed from public export"
      - "2026-06-29: MOVE — data_hub.py, bridge.py → src/_legacy/data/; gateway/__init__.py is shim"
      - "2026-06-29: 10 test files, 2 scripts, 3 boundary tests, Harvester boundary test updated"
      - "2026-06-29: 389 framework tests pass (0 new import failures); 777 root tests pass"
      - "2026-06-30: SEAL — _legacy/data/ read-only; gateway/adapters shims with deprecation; boundary test enforces"
    affected_files:
      - src/_legacy/data/data_sources.py
      - src/_legacy/data/data_hub.py
      - src/_legacy/data/bridge.py
      - src/_legacy/data/public_adapters.py
      - src/_legacy/data/external_downloads.py
      - src/data/gateway/__init__.py  # shim re-export
      - src/data_access/legacy_adapter.py
    review_date: "2026-07-01"
    hard_deadline: "2026-07-15"
    risk_if_ignored: >
      Legacy acquisition layer partially remains; ~2854 lines unmanaged.
    fallback_if_expired: >
      Mark as legacy_retain; add ALLOW_LEGACY_DATASOURCES guard; keep in _legacy/.

  - id: sys_path_consolidation
    title: "Consolidate sys.path.insert to _workspace_imports.py"
    owner: Workbench
    status: completed
    reason: >
      31 scripts now use _workspace_imports.py for auditable path management.
      All scripts verified via --help smoke (25/25 passed).
      architecture_reality_audit check_manual_sys_path_insert: 0 findings.
      test_daily_pipeline_subprocess_smoke.py: 26 passed (no update needed).
    completed_date: "2026-06-29"
    execution_window: "1 day (verify all migrated scripts pass smoke tests)"
    evidence_window: "7 days (verify no import breakage across pipeline runs)"
    progress:
      - "2026-06-17: _workspace_imports.py created with 6 helper functions"
      - "2026-06-17: 15 scripts migrated to use helper"
      - "2026-06-17: architecture_reality_audit check_manual_sys_path_insert: 0 findings"
      - "2026-06-29: 31 scripts confirmed using _workspace_imports"
      - "2026-06-29: --help smoke: 25/25 passed (1 non-blocking: structural_replay_v2 needs module deps)"
      - "2026-06-29: test_daily_pipeline_subprocess_smoke.py: 26 passed (no update needed)"
    review_date: "2026-07-01"
    hard_deadline: "2026-07-15"
    risk_if_ignored: >
      sys.path management remains unstructured; migration to module runner harder.
    fallback_if_expired: >
      Keep _workspace_imports.py as permanent transitional layer.

  - id: legacy_data_move_step2
    title: "Move legacy data modules to _legacy/data/ (P1 Step 2)"
    owner: Deformation Framework
    status: completed
    blocked_by: data_sources_retirement
    reason: >
      Step 1 FREEZE complete (ALLOW_LEGACY_DATAHUB=1 guard on data_sources.py,
      external_downloads.py, public_adapters.py).  Step 2 MOVE completed 2026-06-29:
      (a) files moved to src/_legacy/data/, (b) src/data/__init__.py
      stopped exporting legacy symbols, (c) all internal imports updated.
    completed_date: "2026-06-29"
    evidence:
      - "389 framework tests pass; 0 new import failures"
      - "from src.data import DataHub → ImportError (seal confirmed)"
      - "Root boundary tests: 16 passed"
      - "Framework boundary tests: 5 passed"
    migration_steps:
      - "mkdir -p src/_legacy/data/"  # completed
      - "mv src/data/data_sources.py src/_legacy/data/"  # completed
      - "mv src/data/external_downloads.py src/_legacy/data/"  # completed
      - "mv src/data/adapters/public_adapters.py src/_legacy/data/"  # completed
      - "Update src/data/__init__.py — remove legacy symbol exports"  # completed
      - "Update internal imports (data_hub.py, legacy_adapter.py)"  # completed
      - "Verify: python3 scripts/architecture_reality_audit.py --json"  # pending
    review_date: "2026-06-24"
    hard_deadline: "2026-07-01"
    risk_if_ignored: >
      Legacy files remain in public src/data/ — import guard is only defense.
    fallback_if_expired: >
      Keep files in place with guard; mark as legacy_retain.

  - id: dependency_locking
    title: "Lock dependencies per module (P5)"
    owner: Workbench
    status: deferred
    reason: >
      Each submodule (Workbench, Harvester, Learning Hub, Framework) has
      different dependency needs.  Short-term: add constraints.txt or
      requirements-lock.txt per module.  Long-term: unified lock.
    execution_window: "1-2 days (create lock files per module)"
    evidence_window: "30 days (verify CI reproducibility across environments)"
    trigger_condition: >
      Execute when any module adds a new dependency that causes version
      conflict, or when CI is set up.
    deliverables:
      - "Workbench/constraints.txt — pin pandas, numpy, omegaconf versions"
      - "Harvester/constraints.txt — pin requests, pyarrow versions"
      - "Learning Hub/constraints.txt — pin torch, sentence-transformers"
      - "Framework: mark optional deps in requirements.txt as [optional]"
    review_date: "2026-07-15"
    hard_deadline: "2026-08-15"
    risk_if_ignored: >
      Version drift between modules; reproducibility issues.
    fallback_if_expired: >
      Document known version ranges in MODULES.md; accept manual management.

