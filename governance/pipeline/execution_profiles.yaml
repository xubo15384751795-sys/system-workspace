    refresh_current:
    - neutral_pressure_measurement
    - quality_validation
    - measurement_quality_report
    - judgment_layer
    - judgment_promotion_gate
    - trade_decision
    - risk_gate
    - record_trade_decision
    - signal_card
    - signal_consensus
    - current_status
    - system_index
    - work_brief
    - next_actions
    - evidence_grade_report
    - build_artifact_registry
    - record_daily_run_event
    - readme_first
    - freshness_validator
    work_cycle_quick_render:
    - signal_card
    - signal_consensus
    - work_brief
    - build_data_gaps
    work_cycle_standard_core:
    - quality_validation
    - judgment_layer
    - judgment_promotion_gate
    - trade_decision
    - risk_gate
    - record_trade_decision
    - market_feedback
    - claim_evaluator
    - claim_ladder_tracker
    - learning_hub_feedback
    - learning_summary
    - system_index
    - readme_first
    - next_actions
    work_cycle_always:
    - change_analysis
    - supervisor_check
    - governance_status
  execution_policy:
    default_timeout_seconds: 1800
    subprocess_justifications:
      harvester: real_process_isolation
      bridge: archive_legacy_executable
      run_operator_detections: archive_legacy_executable
      regime_detection: real_process_isolation
      probabilistic_context: archive_legacy_executable
      signal_monitor: archive_legacy_executable
      proxy_quality_report: archive_legacy_executable
      proxy_lifecycle: archive_legacy_executable
      position_sizing: archive_legacy_executable
      build_overlay_shadow_report: archive_legacy_executable
      build_event_replay_factory: archive_legacy_executable
      routing_decision: archive_legacy_executable
      asof_integrity_check: archive_legacy_executable
      baseline_comparison: archive_legacy_executable
      threshold_review_bridge: archive_legacy_executable
