[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-risk-harvester"
version = "0.1.0"
description = "Immutable, manifest-backed data bundles for the Structural Deformation Research System."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.10",
    "jsonschema>=4.20",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
openbb = [
    "openbb>=4.7,<5",
]
sdk = [
    "openbb>=4.7,<5",
    "fredapi>=0.5",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
harvester = "harvester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
