# Machine-consumed system invariants. Human principles live on the compact
# ROUTING_CONSTITUTION.md surface; decisions and explanations are precedent.
schema_version: system_constitution.v2
updated_at: "2026-07-18"

hard_authority_rule:
  only_current_or_formal_runs_can_affect_core_judgment: true
  prohibited_from_core_judgment:
    - "Output/sandbox/"
    - "Output/research/"
    - "Output/archive/"
    - "Output/system_learning/"
  authorized_runtime_chain:
    - "Output/current/"
    - "Output/judgment/"
    - "Output/trade_decision/"
    - "Output/quality/"
    - "Output/horizon_events/"
    - "Output/caselab/"
    - "canonical Data evidence releases"
  bridge_rule: "sandbox/research → bridge/gate → current (then current is authorized)"

module_roles:
  world_model:
    description: "Provides mechanisms, cases, variables, indicators"
    allowed_outputs: ["hypothesis", "mechanism", "evidence_record"]
    forbidden_outputs: ["signal", "trade", "position"]
    examples: ["Paper", "CaseLab"]
  proxy:
    description: "Provides observable measurements"
    allowed_outputs: ["measurement", "reading", "quality_score"]
    forbidden_outputs: ["signal", "trade", "position"]
    examples: ["M_proxy", "D_proxy", "K_proxy", "X_proxy"]
  operator:
    description: "Transforms observations into structured judgments"
    allowed_outputs: ["judgment", "decision", "permission"]
    forbidden_outputs: ["direct_position"]
    examples: ["judgment_layer", "trade_decision_layer"]
  gate:
    description: "Enforces constraints on outputs"
    allowed_outputs: ["pass", "fail", "block", "allow"]
    forbidden_outputs: ["signal", "trade"]
    examples: ["promotion_gate", "risk_gate", "freshness_gate"]
  uncertainty:
    description: "Provides probabilistic context"
    allowed_outputs: ["forecast_interval", "tail_probability", "confidence_band"]
    forbidden_outputs: ["direction", "signal", "trade"]
    examples: ["GluonTS", "probabilistic_context"]
  calibration:
    description: "Provides feedback and learning"
    allowed_outputs: ["feedback", "calibration_score", "hit_rate"]
    forbidden_outputs: ["signal", "trade", "position"]
    examples: ["Qlib", "replay", "Learning Hub"]
  event_radar:
    description: "Detects external events"
    allowed_outputs: ["event_candidate", "mechanism_match"]
    forbidden_outputs: ["signal", "trade", "position"]
    examples: ["Horizon"]

governance_freeze:
  active: true
  manifest: governance/governance_freeze_manifest.yaml

freshness_rules:
  evidence_release_ttl_days: 3
  core_judgment_on_expired_snapshot: blocked
  research_use_on_expired_snapshot: allowed_with_stale_warning
  training_feedback_on_expired_snapshot: allowed_if_marked_stale
  max_age_hours:
    judgment: 48
    trade_decision: 48
    risk_gate: 48
    learning_summary: 72
    system_index: 24
    readme: 24
    harvester: 48
    structural_replay: 48
    framework_output: 48
    promotion_gate: 48
    signal_card: 24
    signal_consensus: 24
    work_brief: 24
