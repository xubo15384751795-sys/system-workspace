  promotion_requirements: []
deformation_framework:
  status: ARCHIVED_FALSIFIED
  owner: system
  last_verified: "2026-07-18"
  allowed_claims:
  - reproduce_historical_evidence
  - inspect_falsification_record
  - support_methodology_postmortem
  forbidden_claims:
  - execute_in_default_path
  - write_current_output
  - write_new_authoritative_run
  - restore_universal_predictor_claim
  - direct_http_acquire
  - raw_public_data_fetch
  - promote
  blockers: []
  last_audit_method: claim_level_falsification_and_runtime_denial
  audit_cadence: on_change
  archival_invariants:
  - isolate_legacy_acquisition_in_src_data_init  # COMPLETED 2026-06-29 — files moved to src/_legacy/data/
  - add_boundary_tests_forbidden_imports  # COMPLETED 2026-06-30 — test_production_paths_do_not_import_legacy in test_data_boundary_extended.py
  - harvester_becomes_only_provider_owner  # COMPLETED 2026-07-07 — DuckDB snapshot store SEAL'd; HarvesterSnapshotStore canonical
  decision: >
    2026-07-18: the four-channel universal-predictor host theory is archived
    as falsified for operational authority. Evidence is retained; execution,
    current publication, promotion, and patch-to-revive are permanently denied.
  notes: >
    data_sources.py, external_downloads.py, public_adapters.py moved to
    src/_legacy/data/ on 2026-06-29. src/data/__init__.py no longer exports
    DataHub/SourceRegistry/create_data_hub. Legacy gateway (data_hub.py,
    bridge.py) still in src/data/gateway/ as transitional shim — SEALED
    2026-06-30 (read-only, deprecation warnings active, retire_after: 2026-10-15).
    Boundary test test_production_paths_do_not_import_legacy added 2026-06-30
    with explicit exemptions for transitional shims (gateway, adapters).
    2026-07-07: DuckDB snapshot store migration SEAL phase complete —
    DuckDBSnapshotStore write methods guarded (ALLOW_LEGACY_DUCKDB),
    HarvesterSnapshotStore is the canonical backend, DualWriteSnapshotStore
    covers the evidence window. Gateway shim retirement (retire_after
    2026-10-15) no longer blocked by snapshot store.
