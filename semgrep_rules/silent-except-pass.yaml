rules:
  - id: silent-except-pass-in-critical-gates
    pattern-regex: '(?m)^\s*except(?:\s+[^:]+)?:\s*$\n\s+pass\s*$'
    message: >
      Silent except ...: pass in critical code. Exceptions must be
      logged (print/stderr) or escalated (NNF#29).
    severity: WARNING
    languages:
      - python
