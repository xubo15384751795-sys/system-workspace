rules:
  - id: force-promotion-without-accountability
    patterns:
      - pattern-either:
          - pattern: |
              "--force"
          - pattern: |
              force_promoted: true
    message: |
      Force promotion requires --authorized-by and --reason (NNF#26).
    severity: WARNING
    languages:
      - python
    paths:
      include:
        - "**/*promot*.py"
        - "**/*promotion*.py"
      exclude:
        - /packages/workbench/src/workbench/workspace/promote_snapshot.py
