# CI Minimal Gate — multi-layer pipeline for fast feedback + full coverage.
#
# Architecture:
#   pre-commit / lint / lock-integrity ─┐
#   security / sast / module tests ─────┼─> merge-gate
#   clean-room / orchestration / root integration ─┘
#
# Module and integration jobs run as separate focused checks. The final
# merge-gate is the only aggregate authority and explicitly requires every
# upstream result to be success; it is not implied by job scheduling order.
# See also: nightly.yml (full daily pipeline), weekly-governance.yml (governance deep check).
#
# 2026-07-07: Submodules consolidated into packages/ — no submodule checkout needed.

name: CI Minimal Gate

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Layer 0: Fast gates (run immediately, no dependencies) ──────────────

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          PYTHONPATH: ".:scripts"
      - name: PACE routing decision
        env:
          PACE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.commands.ci.check_pace_routing --base-ref "$PACE_BASE_SHA"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Python syntax check
        run: |
          python -m py_compile scripts/daily_run.py
          python -m py_compile scripts/freshness_validator.py
          python -m py_compile scripts/build_system_index.py
          python -m py_compile scripts/judgment_layer.py
          python -m py_compile scripts/trade_decision_layer.py
          python -m py_compile scripts/record_trade_decision.py
          python -m py_compile scripts/hmm_stability_audit.py
          python -m py_compile scripts/build_signal_card.py
          python -m py_compile scripts/build_work_brief.py
          python -m py_compile scripts/caselab_daily_signal.py
          python -m py_compile packages/workbench/src/workbench/judgment/claim_ladder.py
          python -m py_compile packages/workbench/src/workbench/judgment/layer.py
          python -m py_compile packages/workbench/src/workbench/judgment/promotion_gate.py
      - name: Ruff lint
        run: uv run --locked ruff check scripts/ tests/ --select E,F,W,I --ignore E501,E402
      - name: Ruff package lint
        run: >-
          uv run --locked ruff check
          packages/*/src packages/*/tests
          --select E,F,W
          --ignore E501,E402
      - name: Generation writer inventory
        run: python scripts/check_generation_writer_inventory.py --json
      - name: Pipeline documentation authority check
        run: python -m system_cli pipeline docs --check

  lock-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Exact workspace sync
        run: uv sync --locked --all-packages --no-dev
      - name: Verify resolved environment
        run: uv pip check

  package-type-boundaries:
    needs: lock-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Type-check owned package boundaries
        run: >-
          uv run --locked python -m mypy
          system_runtime
          packages/framework/src/api
          packages/framework/src/data_access
          packages/harvester/src/harvester/http_gateway.py
          packages/harvester/src/harvester/core/observation.py
          packages/harvester/src/harvester/core/manifest.py
          packages/harvester/src/harvester/core/provenance.py
          packages/workbench/src/workbench/external_http.py
          packages/orchestration/orchestration
          --explicit-package-bases
          --follow-imports=skip
          --ignore-missing-imports
          --no-error-summary
          --show-error-codes
        env:
          PYTHONPATH: ".:packages/framework/src:packages/harvester/src:packages/workbench/src:packages/orchestration:scripts"

  wheel-integrity:
    needs: lock-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - verity
          - structural-deformation-research-system
          - structural-risk-harvester
          - structural-workbench
          - system-learning-hub
          - system-orchestration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Build workspace wheel
        run: >-
          uv build
          --no-sources
          --build-constraints constraints/build-constraints.txt
          --require-hashes
          --package "${{ matrix.package }}"
          --wheel
          --out-dir "$RUNNER_TEMP/system-wheels"
      - name: Require wheel output
        run: test -n "$(find "$RUNNER_TEMP/system-wheels" -maxdepth 1 -name '*.whl' -print -quit)"

  clean-room-release:
    needs: lock-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Verify lockfile and exact workspace sync
        run: |
          uv lock --check
          uv sync --locked --all-packages --no-dev
      - name: Build all distributions without workspace sources
        run: |
          mkdir -p "$RUNNER_TEMP/system-release"
          uv build --no-sources --all-packages \
            --build-constraints constraints/build-constraints.txt \
            --require-hashes --wheel --sdist \
            --out-dir "$RUNNER_TEMP/system-release"
      - name: Export locked external dependencies
        run: >-
          uv export --locked --no-dev --all-packages --no-editable
          --no-emit-project --no-emit-workspace --no-annotate
          --format requirements.txt
          --output-file "$RUNNER_TEMP/release-requirements.txt"
      - name: Install wheels into an independent environment
        run: |
          uv venv "$RUNNER_TEMP/release-venv"
          uv pip sync --python "$RUNNER_TEMP/release-venv/bin/python" \
            "$RUNNER_TEMP/release-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" \
            --no-deps "$RUNNER_TEMP/system-release"/*.whl
          uv pip check --python "$RUNNER_TEMP/release-venv/bin/python"
          uv pip freeze --python "$RUNNER_TEMP/release-venv/bin/python" \
            > "$RUNNER_TEMP/installed-freeze.txt"
          "$RUNNER_TEMP/release-venv/bin/python" -c \
            'import importlib.metadata as m, sys; expected={"verity","structural-deformation-research-system","structural-risk-harvester","structural-workbench","system-learning-hub","system-orchestration"}; installed={d.metadata["Name"].lower() for d in m.distributions() if d.metadata.get("Name")}; assert {x.lower() for x in expected} <= installed; assert all("/Users/a1/System" not in p for p in sys.path)'
      - name: Build release manifest and SBOM evidence
        run: |
          python scripts/build_release_evidence.py \
            --root "$PWD" \
            --artifact-dir "$RUNNER_TEMP/system-release" \
            --installed-freeze "$RUNNER_TEMP/installed-freeze.txt" \
            --output-dir "$RUNNER_TEMP/release-evidence"
      - name: Verify vulnerability ledger is bound to this release
        run: >-
          python scripts/verify_vulnerability_ledger.py
          --root "$PWD"
          --artifact-manifest "$RUNNER_TEMP/release-evidence/release-manifest.json"
          --json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-room-release-evidence
          path: |
            ${{ runner.temp }}/release-evidence
            ${{ runner.temp }}/system-release
          if-no-files-found: warn

  orchestration-default-path:
    needs: lock-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Test compiled per-step graph and outcome adapter
        run: >-
          uv run --locked python -m pytest
          tests/test_dagster_compiled_plan.py
          tests/test_orchestration_default_path.py
          tests/test_plan_apply.py
          tests/test_minimum_monitoring.py
          tests/test_feedback_sample_eligibility.py
          packages/orchestration/tests/test_boundary_pilot.py
          packages/orchestration/tests/test_dagster_daily_op.py
          packages/orchestration/tests/test_orchestration_cli_daily.py
          -q --tb=short --durations=25
      - name: Test launchd wrapper to Dagster daily dry-run
        run: |
          PYTHON="$(uv run --locked python -c 'import sys; print(sys.executable)')"
          SYSTEM_ROOT="$PWD" PYTHON="$PYTHON" bash scripts/run_daily_scheduled.sh --dry-run
        env:
          PYTHONPATH: ".:packages/orchestration:packages/framework/src:packages/workbench/src:scripts"

  security-regression:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Phase-A security boundary regression
        run: >-
          uv run --locked python -m pytest
          tests/test_security_hardening.py
          tests/test_framework_boundary.py
          tests/test_architecture_boundary.py
          -q --tb=short --durations=25

  sast:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.162.0
      - name: Run repository SAST rules
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: semgrep scan --config=semgrep_rules/ --error --metrics=off

  # ── Layer 1: Per-module tests (parallel, gated on lint) ─────────────────

  workbench:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Run Workbench tests
        run: uv run --locked python -m pytest packages/workbench/tests/ -q --tb=short --durations=25

  deformation:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages --extra viz
      - name: Run deformation-framework tests
        run: uv run --locked python -m pytest packages/framework/tests/ -q --tb=short --durations=25

  harvester:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Run harvester tests
        run: uv run --locked python -m pytest packages/harvester/tests/ -q --tb=short --durations=25

  hub:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Run learning-hub tests
        run: uv run --locked python -m pytest packages/learning_hub/tests/ -q --tb=short --durations=25

  # ── Layer 2: Integration (root contract tests + pipeline) ───────────────

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
          python-version: ["3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Clean-checkout Data/Output boundary (before root tests)
        run: >-
          python -m scripts.commands.ci.clean_checkout_boundary
          --root "$GITHUB_WORKSPACE"
          --phase before
          --state-file "$RUNNER_TEMP/system-clean-checkout-boundary.json"
      - name: Root contract tests
        run: |
          uv run --locked python -m pytest tests/ -q --tb=short --durations=25 -m "critical_gate or semantic or governance_loop" \
            --ignore=tests/test_backfill_judgment_calibration.py \
            --ignore=tests/test_mechanism_tiers.py
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Architecture boundary audit
        run: uv run --locked python scripts/commands/weekly/architecture_reality_audit.py --json
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Daily pipeline dry-run
        run: uv run --locked python scripts/daily_run.py --dry-run
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Schema validation (clean-checkout N/A, never fake PASS)
        run: uv run --locked python -m scripts.commands.ci.validate_current_schemas --ci-clean-checkout
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Entrypoint registry completeness
        run: uv run --locked python -m pytest tests/test_entrypoint_registry_completeness.py::test_registry_paths_exist -q --tb=short --durations=25
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Experiment → core judgment check
        run: uv run --locked python scripts/verify_experiment_core_judgment.py
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Output freshness check (clean-checkout N/A, never fake PASS)
        run: uv run --locked python scripts/check_output_freshness.py --ci-clean-checkout --json
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Governance boundary type check
        run: >-
          uv run --locked python -m mypy
          scripts/check_governance_freeze.py
          scripts/_deformation_archive_guard.py
          scripts/verify_experiment_core_judgment.py
          --follow-imports=skip
          --ignore-missing-imports
          --no-error-summary
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Clean-checkout Data/Output boundary (after root tests)
        if: always()
        run: >-
          python -m scripts.commands.ci.clean_checkout_boundary
          --root "$GITHUB_WORKSPACE"
          --phase after
          --state-file "$RUNNER_TEMP/system-clean-checkout-boundary.json"

  # ── Layer 3: Single authoritative merge-gate (Phase C4) ─────────────────
  #
  # This is the ONE required status for branch protection. It needs every
  # upstream job; only when all pass does merge-gate pass. No job on this
  # required path uses continue-on-error or `|| true`. Focused/marker-subset
  # tests in `integration` are dev feedback; merge-gate treats any failure as
  # a merge block. Configure branch protection to require ONLY `merge-gate`.
  merge-gate:
    if: ${{ always() }}
    needs: [pre-commit, lint, lock-integrity, package-type-boundaries, wheel-integrity, clean-room-release, orchestration-default-path, security-regression, sast, workbench, deformation, harvester, hub, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.15
      - name: Exact workspace sync
        run: uv sync --locked --all-packages
      - name: Verify upstream job results
        env:
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          LOCK_INTEGRITY_RESULT: ${{ needs.lock-integrity.result }}
          PACKAGE_TYPE_BOUNDARIES_RESULT: ${{ needs.package-type-boundaries.result }}
          WHEEL_INTEGRITY_RESULT: ${{ needs.wheel-integrity.result }}
          CLEAN_ROOM_RELEASE_RESULT: ${{ needs.clean-room-release.result }}
          ORCHESTRATION_DEFAULT_PATH_RESULT: ${{ needs.orchestration-default-path.result }}
          SECURITY_REGRESSION_RESULT: ${{ needs.security-regression.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          WORKBENCH_RESULT: ${{ needs.workbench.result }}
          DEFORMATION_RESULT: ${{ needs.deformation.result }}
          HARVESTER_RESULT: ${{ needs.harvester.result }}
          HUB_RESULT: ${{ needs.hub.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          for result in "$PRE_COMMIT_RESULT" "$LINT_RESULT" "$LOCK_INTEGRITY_RESULT" "$PACKAGE_TYPE_BOUNDARIES_RESULT" "$WHEEL_INTEGRITY_RESULT" "$CLEAN_ROOM_RELEASE_RESULT" "$ORCHESTRATION_DEFAULT_PATH_RESULT" "$SECURITY_REGRESSION_RESULT" "$SAST_RESULT" "$WORKBENCH_RESULT" \
            "$DEFORMATION_RESULT" "$HARVESTER_RESULT" "$HUB_RESULT" "$INTEGRATION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "upstream job result is not success: $result" >&2
              exit 1
            fi
          done
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Merge gate (full verification, SHA-bound manifest)
        run: uv run --locked python scripts/verify_merge.py --merge
        env:
          PYTHONPATH: ".:packages/framework/src:packages/workbench/src:scripts"
      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-gate-manifest
          path: Output/verification/merge_gate_manifest.json
          if-no-files-found: warn
