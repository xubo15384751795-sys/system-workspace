[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-orchestration"
version = "0.1.0"
description = "Dagster orchestration for the Structural Risk Workbench daily pipeline."
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quality = [
    "pandera>=0.20",
    "great_expectations>=1.0",
    "pandas>=2.0",
]
ui = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8.0",
    "dagster-webserver>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestration*"]
