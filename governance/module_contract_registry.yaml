schema_version: module_contract.v1
created: "2026-06-17"
purpose: >
  Module contracts declare what each module accepts, produces, and forbids.
  Enables independent use: anyone can read a module's contract and integrate
  without understanding the full system knowledge.

modules:
  harvester:
    standalone_usable: true
    description: "Evidence release builder — collects, validates, publishes data"
    accepts:
      - data_request
      - series_specification
    produces:
      - evidence_release
      - catalog_manifest
      - provenance_record
    forbidden:
      - core_judgment
      - trade_decision
      - position_sizing
    data_authority: canonical
    contract_path: structural-risk-harvester/

  framework:
    standalone_usable: true
    description: "Structural diagnostics engine — computes M/D/K/X, SigmaVector"
    accepts:
      - admitted_evidence
      - harvester_release
    produces:
      - structural_diagnostics
      - sigma_vector
      - framework_output
    forbidden:
      - direct_http_acquisition
      - data_curation
    data_authority: consumer_only
    contract_path: "deformation-framework/"

  workbench:
    standalone_usable: true
    description: "Artifact navigator, judgment UI, current readout"
    accepts:
      - framework_output
      - evidence_release
      - run_events
    produces:
      - current_readout
      - artifact_navigation
      - judgment_card
      - promotion_gate
    forbidden:
      - direct_data_acquisition
      - structural_computation
    data_authority: consumer_only
    contract_path: Workbench/

  learning_hub:
    standalone_usable: true
    description: "Governance memory, run audit, calibration feedback"
    accepts:
      - run_events
      - governance_events
      - calibration_data
    produces:
      - improvement_queue
      - activity_distribution
      - calibration_report
      - system_health_report
    forbidden:
      - core_judgment
      - data_acquisition
    data_authority: consumer_only
    contract_path: system-learning-hub/

composition_rules:
  - "System = Harvester + Framework + Workbench + Learning Hub"
  - "Each module can be installed and used independently"
  - "Modules communicate through published artifacts, not internal APIs"
  - "No module may bypass another module's contract"
  - "Adding a new module requires a contract entry in this registry"
