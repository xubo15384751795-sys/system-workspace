# feature_flags.yaml — Runtime feature gates for the Structural Research Harness.
#
# Each feature has a lifecycle status that determines where its output may flow:
#
#   paper_aligned        — Production-ready; allowed in paper/main output
#   engineering_required — Needs engineering work; dev/experiment only, not paper
#   exploratory          — Research-stage; experiment/sandbox only, not paper
#   experimental         — Very early; sandbox only
#   disabled             — Turned off; cannot run at all
#   denied_for_release   — Can run internally, denied in release/publish context
#   archived_denied      — Archived evidence only; cannot execute as a live host
#
# Target output buckets (in decreasing trust):
#   paper/main_output   — final paper figures, tables, narrative output
#   paper/supplementary — supplementary materials attached to paper
#   benchmark_report    — benchmark/calibration reports
#   experiment          — experimental results, internal dashboards
#   sandbox             — throwaway runs, debugging, prototyping
#
# Runtime gates act BEFORE tool execution:
#   Agent does NOT need to remember "don't use that in production."
#   The gate says: your feature is [status], target is [output], → deny.

version: "0.2.0"

# ── Operational toggles (unchanged from v0.1.0) ──────────────────────────

flags:
  policy_enforcement_enabled:
    default: true
    description: "Master switch for all policy enforcement."
    controlled_by: harness_operator

  require_manual_review_for_finalize:
    default: true
    description: "Require manual human review before release_finalization or snapshot_publish."
    controlled_by: harness_operator

  block_cross_boundary_reads:
    default: true
    description: "Block cross-boundary read operations."
    controlled_by: harness_operator

  log_all_tool_invocations:
    default: true
    description: "Write event record for every tool invocation."
    controlled_by: harness_operator

  log_policy_decisions:
    default: true
    description: "Emit events for every policy decision."
    controlled_by: harness_operator

  auto_ingest_failures:
    default: true
    description: "Auto-ingest tool failures into Learning Hub."
    controlled_by: harness_operator

  auto_ingest_verification_results:
    default: true
    description: "Auto-ingest verification results into Learning Hub."
    controlled_by: harness_operator

# ── Feature Definitions ──────────────────────────────────────────────────

features:
  # ── Deformation v1 archive (ARCHIVED_FALSIFIED) ────────────────────────
  deformation.ode_diffrax:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — Diffrax ODE backend is historical evidence only.
      Not an operational host feature.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  deformation.operator_noncommutativity:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — operator noncommutativity evidence may be inspected
      in the archive; it has no live execution or paper authority.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  deformation.shadow_maturity_profile:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — shadow maturity profile is historical evidence only.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  deformation.gnn_benchmark:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — GNN benchmark is historical evidence only.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  deformation.narrative_detector:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — narrative detector is historical evidence only.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  deformation.simulated_data_fallback:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — simulated fallback cannot execute as a live host.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  deformation.benchmark_dominance:
    owner: deformation_v1_archive
    status: archived_denied
    default_enabled: false
    description: >
      ARCHIVED_FALSIFIED — benchmark dominance is historical evidence only.
    allowed_outputs: []
    promotion_requires:
      - N/A — archived_denied

  # ── Harvester Subsystem ────────────────────────────────────────────────

  harvester.fred_provider:
    owner: harvester_team
    status: engineering_required
    default_enabled: true
    description: >
      FRED (Federal Reserve Economic Data) data provider.  API integration
      requires FRED API key and rate-limit handling.  Engineering review
      needed for production release inclusion.
    allowed_outputs:
      - sandbox
      - experiment
    promotion_requires:
      - api_error_handling_audit
      - rate_limit_acceptance_test
      - data_freshness_monitor

  harvester.sec_provider:
    owner: harvester_team
    status: engineering_required
    default_enabled: true
    description: >
      SEC EDGAR data provider.  API integration requires handling of filing
      formats, rate limits, and deduplication.  Engineering review needed
      for production release inclusion.
    allowed_outputs:
      - sandbox
      - experiment
    promotion_requires:
      - filing_format_coverage_audit
      - dedup_accuracy_test
      - rate_limit_acceptance_test

  harvester.simulated_data_fallback:
    owner: harvester_team
    status: denied_for_release
    default_enabled: false
    description: >
      Synthetic data generator used when real providers are unavailable.
      Essential for CI but MUST NOT enter any finalized release.
    allowed_outputs:
      - sandbox
    promotion_requires:
      - N/A — permanently denied for release contexts

  # ── Learning Hub Subsystem ─────────────────────────────────────────────

  learning_hub.auto_approval:
    owner: learning_hub_team
    status: disabled
    default_enabled: false
    description: >
      Automated approval of low-risk improvements without human review.
      Currently disabled pending governance board review.
    allowed_outputs: []
    promotion_requires:
      - governance_board_review
      - approval_accuracy_threshold_met
      - false_positive_rate_audit

  learning_hub.llm_issue_classifier:
    owner: learning_hub_team
    status: exploratory
    default_enabled: false
    description: >
      LLM-based issue classifier that categorizes events into improvement
      tickets.  Exploratory — classifications may be inaccurate.
    allowed_outputs:
      - sandbox
      - experiment
    promotion_requires:
      - human_labeled_validation_set
      - accuracy_vs_baseline_report
      - paper_alignment_review

# ── Output bucket hierarchy (for gate resolution) ────────────────────────

output_hierarchy:
  sandbox: 1
  experiment: 2
  benchmark_report: 3
  paper/supplementary: 4
  paper/main_output: 5

# ── Default gate when no feature is declared ─────────────────────────────

default_feature_status: engineering_required
