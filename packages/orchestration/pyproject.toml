[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-orchestration"
version = "0.1.0"
description = "Dagster orchestration for the Structural Risk Workbench daily pipeline."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster>=1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quality = [
    "pandera>=0.20",
    "pandas>=2.0",
    "exchange-calendars>=4.5,<5",
]
ge = [
    "great_expectations>=1.0,<2.0; python_version < '3.14'",
]
ui = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8.0",
    "dagster-webserver>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestration*"]
