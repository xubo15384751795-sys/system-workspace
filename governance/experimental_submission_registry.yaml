schema_version: experimental_submission.v1
created: "2026-06-17"
purpose: >
  Registry for non-compliant but potentially valuable explorations.
  Submissions are reviewed weekly. Successful submissions can modify rules,
  enter Harvester pipeline, or promote to preferred/canonical.
  See: governance/incentive_policy.yaml

submissions: []
