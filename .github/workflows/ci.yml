# CI Minimal Gate — multi-layer pipeline for fast feedback + full coverage.
#
# Architecture:
#   pre-commit ─┐
#   lint        ─┤
#   semgrep     ─┼─> workbench    ─┐
#               │   deformation  ─┤
#               │   harvester    ─┼─> integration (root tests + pipeline)
#               │   hub          ─┘
#
# Each module is tested independently. Integration gates on all modules.
# See also: nightly.yml (full daily pipeline), weekly-governance.yml (governance deep check).

name: CI Minimal Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Rewrite SSH URLs to HTTPS for private submodule checkout in CI.
  # TODO(consolidation): Remove after submodules merge into packages/ (target: 2026-07-31).
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  # ── Layer 0: Fast gates (run immediately, no dependencies) ──────────────

  pre-commit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install ruff
        run: pip install ruff
      - name: Python syntax check
        run: |
          python -m py_compile scripts/daily_run.py
          python -m py_compile scripts/freshness_validator.py
          python -m py_compile scripts/build_system_index.py
          python -m py_compile scripts/judgment_layer.py
          python -m py_compile scripts/trade_decision_layer.py
          python -m py_compile scripts/record_trade_decision.py
          python -m py_compile scripts/hmm_stability_audit.py
          python -m py_compile scripts/build_signal_card.py
          python -m py_compile scripts/build_work_brief.py
          python -m py_compile scripts/caselab_daily_signal.py
          python -m py_compile Workbench/src/workbench/judgment/claim_ladder.py
          python -m py_compile Workbench/src/workbench/judgment/layer.py
          python -m py_compile Workbench/src/workbench/judgment/promotion_gate.py
      - name: Ruff lint (advisory)
        run: ruff check scripts/ tests/ --select E,F,W,I --ignore E501,E402 || true

  # ── Layer 1: Per-module tests (parallel, gated on lint) ─────────────────

  workbench:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install Workbench
        run: |
          pip install --upgrade pip
          pip install -e "Workbench[dev]"
      - name: Run Workbench tests
        working-directory: Workbench
        run: pytest tests/ -q --tb=short

  deformation:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install deformation-framework
        run: |
          pip install --upgrade pip
          pip install -e "deformation-framework[dev]"
      - name: Run deformation-framework tests
        working-directory: deformation-framework
        run: pytest tests/ -q --tb=short

  harvester:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install harvester
        run: |
          pip install --upgrade pip
          pip install -e "structural-risk-harvester[dev]"
      - name: Run harvester tests
        working-directory: structural-risk-harvester
        run: pytest tests/ -q --tb=short

  hub:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install learning-hub
        run: |
          pip install --upgrade pip
          pip install -e "system-learning-hub[dev]"
      - name: Run learning-hub tests
        working-directory: system-learning-hub
        run: pytest tests/ -q --tb=short

  # ── Layer 2: Integration (root contract tests + pipeline) ───────────────

  integration:
    needs: [workbench, deformation, harvester, hub]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Rewrite SSH to HTTPS
        run: git config --global url."https://x-access-token:${{ env.GH_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml
            requirements-dev.txt
      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pydantic
          pip install -e "Workbench[dev]"
          pip install -e "system-learning-hub[dev]"
      - name: Root contract tests
        run: python -m pytest tests/ -q --tb=short --ignore=tests/test_backfill_judgment_calibration.py --ignore=tests/test_mechanism_tiers.py
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Architecture boundary audit
        run: python scripts/architecture_reality_audit.py --json
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Daily pipeline dry-run
        run: python scripts/daily_run.py --dry-run
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Schema validation
        run: |
          python -c "
          import json
          from pathlib import Path
          try:
              import jsonschema
          except ImportError:
              print('ERROR: jsonschema not installed — cannot validate schemas')
              exit(1)

          root = Path('.')
          errors = []

          fw_path = root / 'Output' / 'current' / 'framework_output.json'
          schema_path = root / 'governance' / 'framework_output.schema.json'
          if fw_path.exists() and schema_path.exists():
              data = json.loads(fw_path.read_text())
              schema = json.loads(schema_path.read_text())
              try:
                  jsonschema.validate(data, schema)
                  print('framework_output.json: PASS')
              except jsonschema.ValidationError as e:
                  errors.append(f'framework_output.json: {e.message}')
                  print(f'framework_output.json: FAIL — {e.message}')

          status_path = root / 'Output' / 'current' / 'status.json'
          card_schema_path = root / 'protocols' / 'current_card.schema.json'
          if status_path.exists() and card_schema_path.exists():
              data = json.loads(status_path.read_text())
              schema = json.loads(card_schema_path.read_text())
              try:
                  jsonschema.validate(data, schema)
                  print('status.json: PASS')
              except jsonschema.ValidationError as e:
                  errors.append(f'status.json: {e.message}')
                  print(f'status.json: FAIL — {e.message}')

          if errors:
              print(f'Schema validation failed: {len(errors)} error(s)')
              exit(1)
          print('All schema validations passed.')
          "
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Entrypoint registry completeness
        run: python -m pytest tests/test_entrypoint_registry_completeness.py::test_registry_paths_exist -q --tb=short
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Experiment → core judgment check
        run: python scripts/verify_experiment_core_judgment.py
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Output freshness check
        run: python scripts/check_output_freshness.py
        env:
          PYTHONPATH: "Workbench/src:scripts"
      - name: Type check (advisory)
        run: python -m mypy scripts/ --ignore-missing-imports --no-error-summary || true
        env:
          PYTHONPATH: "Workbench/src:scripts"
