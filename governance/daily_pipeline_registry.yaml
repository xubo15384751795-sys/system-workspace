# Daily Pipeline Registry
# Authority: governance/architecture_reality_decisions.md
# Created: 2026-06-16
# Updated: 2026-06-17 — enriched with input, artifact_path, ttl_hours, core_judgment_dependency
#            structural_replay + bridge changed from compatibility → active (Option A)
#
# Every scripts/daily_run.py step must be registered here before it can be
# treated as part of the governed daily pipeline.
#
# Step status enum:
#   active            — runs in daily_run and may produce governed artifacts
#   blocked           — known gap; must not affect core judgment
#   shadow_active     — records diagnostics only; cannot execute authority
#   compatibility     — active bridge/wrapper pending migration
#   experimental      — research/training feedback only

schema_version: daily_pipeline_registry.v2
updated_at: "2026-06-17"

steps:
  harvester:
    order: 1
    status: active
    owner: Harvester
    command: "python -m harvester daily-release"
    input:
      - external_providers
    produces:
      - Data/harvester/exports/latest/
    artifact_path: Data/harvester/exports/latest/catalog.json
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: block_core_judgment

  etf_refresh:
    order: 2
    status: blocked
    owner: Harvester
    command: "python scripts/refresh_etf_panel.py"
    input:
      - Data/panels/cross_asset_daily_panel.parquet
    produces:
      - Data/features/k_features_daily.csv
    consumes:
      - Data/panels/cross_asset_daily_panel.parquet
    artifact_path: Data/features/k_features_daily.csv
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: false
    core_judgment_dependency: false
    failure_behavior: research_only
    blocker: "ETF acquisition is not yet published as a Harvester evidence release; root script may recompute features only."

  paper_sync:
    order: 3
    status: active
    owner: Harvester
    command: "python scripts/sync_paper_world_model.py"
    input:
      - Data/harvester/exports/latest/
    produces:
      - Data/paper_world_model/
    artifact_path: Data/paper_world_model/
    ttl_hours: 72
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: true
    failure_behavior: lower_claim_ceiling

  horizon_events:
    order: 4
    status: active
    owner: Harvester
    command: "python scripts/horizon_event_adapter.py --sample"
    input:
      - Data/horvester/exports/latest/
    produces:
      - Data/horizon_events/
    artifact_path: Data/horizon_events/
    ttl_hours: 48
    requires_harvester_evidence: true
    requires_provenance: true
    allowed_to_affect_core_judgment: true
    core_judgment_dependency: false
    failure_behavior: lower_claim_ceiling

  structural_replay:
