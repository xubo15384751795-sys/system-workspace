[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-deformation-system"
version = "0.2.0"
description = "Governed structural-risk workspace application"
requires-python = ">=3.12"

# Core runtime dependencies (shared across all submodules)
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "omegaconf>=2.3",
    "mcp>=1.23,<2",
]

[project.scripts]
system = "system_cli.app:main"

[project.optional-dependencies]
ml = [
    "hmmlearn>=0.3",
    "mcp>=1.23,<2",
]
orchestration = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "pandera>=0.20",
    # great_expectations is optional: no wheel for Python >=3.14 yet.
    # packages/orchestration/quality/ge_suite.py emits GE-shaped payloads via Pandera.
    "dvc>=3.50",
    "streamlit>=1.32",
    "lancedb>=0.12",
    "sentry-sdk>=2.0",
]
observability = [
    "sentry-sdk>=2.0",
]
ge = [
    "great_expectations>=0.18.22,<1.0; python_version < '3.14'",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "omegaconf>=2.3",
    "hmmlearn>=0.3",
]
full = [
    "structural-deformation-system[ml,dev,orchestration]",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "system_cli*",
    "system_runtime*",
    "caselab_context*",
    "caselab_runtime*",
    "scripts*",
]

# The four domain distributions stay independently installable.  Workspace
# tooling installs them together; runtime code imports their public packages
# and never mutates sys.path to reach their source trees.
[tool.uv.workspace]
members = [
    "packages/framework",
    "packages/harvester",
    "packages/learning_hub",
    "packages/workbench",
    "packages/orchestration",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git", ".pytest_cache", "__pycache__", "Data", "Output",
    "Workbench", "deformation-framework",
    "Structural Risk Harvester", "Structural Research Harness",
    "System Learning Hub", "contracts",
]
markers = [
    "critical_gate: tests that must pass before promotion",
    "semantic: concept registry, proxy semantics",
    "data_boundary: data boundary compliance, freshness",
    "benchmark: benchmark correctness",
    "report: report verdict gate, export validation",
    "governance_loop: ledger, escalation, incident lifecycle",
    "slow: tests that take >10s",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["deformation-framework/", "Workbench/", "structural-risk-harvester/", "system-learning-hub/"]
